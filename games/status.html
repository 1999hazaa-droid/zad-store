<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>حالة الألعاب | زاد</title>
<style>:root{--p:#7C3AED}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#F5F3FF;color:#3B0764}main{max-width:960px;margin:0 auto;padding:16px}h1{font-size:1.4rem}.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.sm button{border:2px solid #E9D5FF;background:#fff;border-radius:14px;padding:10px;font:inherit;cursor:pointer}.sm button b{display:block;font-size:1.4rem}.sm button.on{border-color:var(--p);background:#EDE9FE}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid #EDE9FE;text-align:start;vertical-align:top}.t{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700}.approved{background:#d1fae5;color:#065f46}.needs_update{background:#fef3c7;color:#92400e}.needs_review,.errors{background:#fee2e2;color:#991b1b}.not_tested{background:#e5e7eb;color:#374151}small{color:#6b7280}.w{overflow-x:auto}</style></head><body><main>
<h1>حالة الألعاب المجانية</h1><p id="meta"></p><div class="sm" id="sm"></div><div class="w"><table><thead><tr><th>اللعبة</th><th>المرحلة</th><th>القسم</th><th>الحالة</th><th>ملاحظات الفحص</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const L={approved:"معتمدة",needs_update:"تحتاج تحديثًا",needs_review:"تحتاج مراجعة",errors:"فيها أخطاء",not_tested:"لم تُختبر"},V={phone:"هاتف",tablet:"تابلت",desktop:"كمبيوتر"};let F="";
fetch("registry.json").then(r=>r.json()).then(d=>{const G=Object.values(d.games);document.getElementById("meta").textContent=`آخر فحص: ${d.generated} · الشاشات: ${d.viewports.map(v=>V[v]||v).join("، ")} · ${d.notes}`;
const sm=document.getElementById("sm");function draw(){sm.innerHTML=`<button data-f="" class="${F?"":"on"}"><b>${G.length}</b>كل الألعاب</button>`+Object.keys(L).map(k=>{const n=G.filter(g=>g.status===k).length;return n?`<button data-f="${k}" class="${F===k?"on":""}"><b>${n}</b>${L[k]}</button>`:""}).join("");sm.querySelectorAll("button").forEach(b=>b.onclick=()=>{F=b.dataset.f;draw();rows()})}
function rows(){document.getElementById("tb").innerHTML=G.filter(g=>!F||g.status===F).map(g=>{const nt=Object.entries(g.tests).map(([v,t])=>{const p=[...t.errors,...t.missing_files,...t.layout];return p.length?`${V[v]||v}: ${p.join("، ")}`:""}).filter(Boolean).join("<br>");return`<tr><td><b>${g.title}</b><br><small>${g.id}</small></td><td>${[...g.ages,...g.grades].join(" ")}</td><td>${g.section||"—"}</td><td><span class="t ${g.status}">${L[g.status]}</span></td><td><small>${nt||"—"}</small></td></tr>`}).join("")}
draw();rows()}).catch(()=>{document.getElementById("meta").textContent="تعذّر تحميل السجلّ"});
</script></main></body></html>
