<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ملف باسم طفلك | زاد التعليمية</title>
<meta name="description" content="اطلب ورقة عمل مخصّصة باسم طفلك وحسب صفه ومستواه، تصلك PDF جاهزة للطباعة على واتساب.">
<meta name="theme-color" content="#5B34D6">
<link rel="icon" href="../images/icons/favicon-64.png" type="image/png">
<link rel="preload" href="../fonts/cairo-regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="../fonts/cairo-bold.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:Cairo;src:url(../fonts/cairo-regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(../fonts/cairo-bold.woff) format("woff");font-weight:700;font-display:swap}
:root{--p:#5B34D6;--bg:#F7F5FF;--t:#1B1430;--m:#6d6684;--ok:#1fa971}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
.top{background:var(--p);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.top a{color:#fff;text-decoration:none;font-weight:700;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.hero{background:linear-gradient(135deg,#5B34D6,#8b5cf6);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:23px}.hero p{margin:0;opacity:.92;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chips span{background:#ffffff26;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.steps{display:flex;gap:8px;margin-bottom:16px}.steps div{flex:1;background:#fff;border-radius:16px;padding:10px 6px;text-align:center;font-size:13px;font-weight:700;box-shadow:0 1px 0 #e6e0f7}.steps b{display:block;font-size:22px}
form{background:#fff;border-radius:22px;padding:18px;box-shadow:0 1px 0 #e6e0f7}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid #e6e0f7;border-radius:14px;background:#fff;color:var(--t);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:2px solid #e6e0f7;border-radius:14px;padding:10px 4px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s}
.seg input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.seg label{margin:0;position:relative}
.price{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:16px;font-weight:700}
.price b{font-size:20px;color:var(--p)}
button{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:17px;background:var(--ok);color:#fff;border:0;border-radius:16px;padding:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
button:active{transform:scale(.98)}
small{display:block;color:var(--m);text-align:center;margin-top:10px;font-size:13px}
.err{color:#d23b3b;font-size:13px;margin-top:6px;display:none}
</style>
</head>
<body>
<div class="top"><a href="../"><img src="../images/logo-zad-s.png" alt="" width="34" height="34"><span>زاد التعليمية</span></a></div>
<main>
<section class="hero">
<h1>ملف باسم طفلك ✨</h1>
<p>ورقة عمل مخصّصة لطفلك أو لطلاب صفّك، حسب الصف والموضوع والمستوى.</p>
<div class="chips"><span>باسم الطفل</span><span>3 مستويات</span><span>شهادة إنجاز</span></div>
</section>
<div class="steps"><div><b>📝</b>املأ الطلب</div><div><b>💬</b>أرسله واتساب</div><div><b>📄</b>يصلك الملف</div></div>
<form id="f" autocomplete="off">
<label for="who">أنا</label>
<div class="seg" id="who">
<label><input type="radio" name="who" value="ولي أمر" checked><span>ولي أمر</span></label>
<label><input type="radio" name="who" value="معلمة"><span>معلمة</span></label>
<label><input type="radio" name="who" value="طالب"><span>طالب</span></label>
</div>
<label for="name">اسم الطفل (أو اسم الصف)</label>
<input id="name" maxlength="40" placeholder="مثال: سالم" required>
<label for="grade">الصف</label>
<select id="grade"><option>الأول</option><option>الثاني</option><option>الثالث</option><option>الرابع</option><option>الخامس</option><option>السادس</option></select>
<label for="subj">المادة</label>
<select id="subj"><option>الرياضيات</option><option>اللغة العربية</option><option>العلوم</option><option>اللغة الإنجليزية</option><option>أخرى</option></select>
<label for="topic">الموضوع المطلوب</label>
<input id="topic" maxlength="80" placeholder="مثال: جدول الضرب، حرف الباء، الكسور" required>
<label>المستوى</label>
<div class="seg" id="lv">
<label><input type="radio" name="lv" value="سهل"><span>سهل</span></label>
<label><input type="radio" name="lv" value="متوسط" checked><span>متوسط</span></label>
<label><input type="radio" name="lv" value="تحدٍّ"><span>تحدٍّ</span></label>
</div>
<label for="note">ملاحظة (اختياري)</label>
<textarea id="note" rows="2" maxlength="160" placeholder="مثال: طفلي يخطئ في الضرب في 7 و8"></textarea>
<div class="price"><span>سعر الملف المخصّص</span><b>1.500 ر.ع</b></div>
<button type="submit"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.3L2 22l4.8-1.2A11 11 0 1 0 20.5 3.5zM12 20a9 9 0 0 1-4.6-1.3l-.3-.2-2.8.7.8-2.7-.2-.3A9 9 0 1 1 12 20zm5-6.7c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7.4 7.4 0 0 1-3.700-3.200c-.3-.5.3-.5.8-1.500a.5.5 0 0 0 0-.5l-.8-1.900c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4c1.700.7 2.300.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.6-.3z"/></svg>أرسل الطلب عبر واتساب</button>
<div class="err" id="err">اكتب اسم الطفل والموضوع أولاً.</div>
<small>يصلك الملف خلال وقت قصير بعد تأكيد الطلب والدفع.</small>
</form>
</main>
<script>
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  var v=function(i){return document.getElementById(i).value.trim()};
  var r=function(n){var x=document.querySelector('input[name="'+n+'"]:checked');return x?x.value:""};
  if(!v("name")||!v("topic")){document.getElementById("err").style.display="block";return}
  var m=["السلام عليكم، أريد طلب ملف مخصّص من زاد التعليمية:","","الطالب/ة: "+v("name"),"الصف: "+v("grade"),"المادة: "+v("subj"),"الموضوع: "+v("topic"),"المستوى: "+r("lv"),"أنا: "+r("who")];
  if(v("note"))m.push("ملاحظة: "+v("note"));
  m.push("","السعر: 1.500 ر.ع");
  window.location.href="https://wa.me/96877336242?text="+encodeURIComponent(m.join("\n"));
});
</script>
</body>
</html>
