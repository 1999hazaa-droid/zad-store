<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5B34D6">
<title>لوحة تحكم زاد</title>
<style>
@font-face{font-family:Cairo;src:url(../fonts/cairo-regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(../fonts/cairo-bold.woff) format("woff");font-weight:700;font-display:swap}
:root{--p:#5B34D6;--p2:#7c5cff;--bg:#f6f3ff;--t:#1B1430;--m:#6d6684;--ok:#1fb57a;--no:#e5484d;--line:#e6e0f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
header h1{margin:0;font-size:21px;color:var(--p)}
.hb{display:flex;gap:8px}
.ib{border:0;background:#fff;border-radius:14px;height:42px;padding:0 14px;font-weight:700;box-shadow:0 3px 0 var(--line);cursor:pointer;text-decoration:none;color:var(--t);display:inline-flex;align-items:center;gap:6px}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.card h3{margin:0 0 8px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:20px;padding:14px;box-shadow:0 3px 0 var(--line);text-align:center}
.stat b{display:block;font-size:30px;color:var(--p);line-height:1.2}
.stat span{color:var(--m);font-size:14px}
.stat.hot{background:#fff3c4;box-shadow:0 3px 0 #ecd57d}
.btn{border:0;border-radius:16px;background:var(--p);color:#fff;font-weight:700;padding:13px 18px;font-size:16px;box-shadow:0 4px 0 #3f22a8;cursor:pointer;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f22a8}
.btn.g{background:#fff;color:var(--p);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0f7f54}
.btn.red{background:#fff;color:var(--no);box-shadow:0 4px 0 #f3c4c6}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 #3f22a8}
.btn.sm.g{box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.item{display:flex;gap:12px;align-items:center;padding:10px;background:#fff;border-radius:18px;margin:8px 0;box-shadow:0 3px 0 var(--line);cursor:pointer}
.item img,.item .ph{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#efeaff;flex:none;display:grid;place-items:center;font-size:24px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--m)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;background:#efeaff;color:var(--p)}
.tag.new{background:#fff3c4;color:#8a6500}.tag.done{background:#d8f5e6;color:#0f7f54}.tag.off{background:#ffe0e0;color:#b02a2f}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{border:0;background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 var(--line);cursor:pointer}
.chip.on{background:var(--p);color:#fff}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p2)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-weight:700;margin-bottom:5px;font-size:14px}
label.f small{color:var(--m);font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ecfb;gap:10px}
.sw:last-child{border:0}
.sw input{width:48px;height:28px;appearance:none;background:#d6cff0;border-radius:99px;position:relative;cursor:pointer;flex:none;transition:.2s}
.sw input:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--ok)}
.sw input:checked:after{right:23px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 20px #5b34d61a;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:12px;font-weight:700;color:var(--m);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button b{font-size:23px;line-height:1.2}
nav button.on{color:var(--p)}
nav button i{position:absolute;top:2px;right:calc(50% - 22px);background:var(--no);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:0 6px}
.ov{position:fixed;inset:0;background:#1b14307a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 6px;color:var(--p);font-size:19px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1B1430;color:#fff;padding:11px 20px;border-radius:99px;z-index:40;font-weight:700;max-width:90%;text-align:center}
.mut{color:var(--m)}.c{text-align:center}
.fab{position:fixed;bottom:92px;left:18px;z-index:7;width:auto;border-radius:99px;padding:13px 22px;box-shadow:0 6px 18px #5b34d655}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big button{border:0;border-radius:20px;padding:18px 8px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 4px 0 var(--s,#d9d0f7);background:var(--c,#fff)}
.big button b{font-size:34px}
.big button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--s)}
.code{font-family:ui-monospace,monospace;direction:ltr;font-weight:700;letter-spacing:1px;color:var(--p)}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login h1{color:var(--p)}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:#efeaff;margin-bottom:6px}
.empty{text-align:center;color:var(--m);padding:30px 0}
.spin{text-align:center;padding:40px;color:var(--m)}
/* الاختبارات */
.qz-kp{margin:4px 0}.qz-pr{font-size:13px;margin:6px 2px 10px}
#qzs{margin-bottom:4px}
.qz-pb{border:0;cursor:pointer;font:inherit;font-size:12px;padding:4px 12px;flex:none}
.qz-n{font-weight:700;color:var(--p);font-size:16px!important}
.qz-q .chip{padding:6px 10px;flex:none}
.qz-th{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#f3efff;flex:none;display:inline-grid;place-items:center;font-size:11px;color:var(--m)}
.qz-th.bad{outline:2px solid var(--no)}
.qz-mf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qz-mf input[type=text]{flex:1 1 150px;min-width:0;font-size:14px;padding:9px 10px}
.qz-upl{font-size:13px;padding:8px 12px;cursor:pointer}.qz-upl.busy{opacity:.6;pointer-events:none}
.qz-pv{display:flex;gap:4px;flex-wrap:wrap}
.qz-it{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;margin:8px 0;display:grid;gap:6px}
.qz-r1{display:flex;gap:6px;align-items:center}.qz-r1 .qx{flex:1;min-width:0}
.qz-rm{padding:6px 10px;font-size:13px;color:var(--no);flex:none}
.qz-ok{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ok);flex:none;cursor:pointer}
.qz-ok input{width:22px;height:22px;accent-color:var(--ok)}
.qz-ok.big{flex:1;justify-content:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px;color:var(--t)}
.qz-bin{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}.qz-bin select{padding:7px 10px;font-size:14px}
.qz-side{display:grid;gap:6px;padding:6px;border-radius:12px;background:#faf8ff}
.qz-types{display:grid;gap:8px}
.qz-types button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:right;cursor:pointer;display:grid;gap:2px}
.qz-types button b{color:var(--p)}.qz-types button small{color:var(--m)}
.sheet h4{margin:14px 0 4px;font-size:15px}
.qz-adv{margin:10px 0;background:#fff;border-radius:14px;padding:8px 12px}.qz-adv summary{font-weight:700;cursor:pointer;color:var(--p);padding:4px 0}
.qz-err{color:var(--no);font-weight:700;min-height:20px;margin:6px 0}
.qz-bar{position:sticky;bottom:88px;z-index:4;display:none;align-items:center;gap:10px;background:#fff3c4;border-radius:18px;padding:8px 10px;margin:12px 0;box-shadow:0 4px 14px #5b34d633}
.qz-bar.on{display:flex}.qz-bar span{font-weight:700;font-size:14px;color:#8a6500;flex:1}.qz-bar .btn{width:auto;padding:10px 16px}
</style>
</head>
