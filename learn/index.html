<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>تعلّم والعب · الحروف العربية | زاد التعليمية</title>
<meta name="description" content="مسار تفاعلي لتعليم الحروف العربية الـ28 للأطفال: لعب وتتبّع وأصوات وتركيب كلمات، مع تقرير لولي الأمر.">
<meta name="theme-color" content="#5B34D6">
<link rel="icon" href="../images/icons/favicon-64.png" type="image/png">
<link rel="preload" href="../fonts/cairo-bold.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:Cairo;src:url(../fonts/cairo-regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(../fonts/cairo-bold.woff) format("woff");font-weight:700;font-display:swap}
:root{--p:#5B34D6;--p2:#8b5cf6;--bg:#f3efff;--t:#1B1430;--ok:#1fb57a;--no:#ff6b6b;--y:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.prog{flex:1;height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px #0001}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),#ff9f1c);border-radius:99px;transition:width .5s}
.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #d9d0f7;cursor:pointer;font-family:inherit}
.stars{background:#fff;border-radius:14px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #d9d0f7;white-space:nowrap}
.guide{display:flex;align-items:flex-end;gap:8px;margin:12px 0 10px}
.owl{width:84px;flex:none;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
.owl.talk .beak{animation:talk .22s ease-in-out infinite alternate}
.owl .lid{transform-origin:center;animation:blink 4s infinite}
.bubble{position:relative;flex:1;background:#fff;border-radius:20px 20px 6px 20px;padding:12px 14px;font-size:17px;font-weight:700;line-height:1.55;box-shadow:0 4px 0 #d9d0f7;min-height:58px}
.bubble .rep{position:absolute;left:8px;bottom:-14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:15px;box-shadow:0 3px 0 #3f22a8;cursor:pointer}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 #d9d0f7;padding:18px;width:100%}
.big{font-size:150px;line-height:1.25;margin-bottom:18px;font-weight:700;color:var(--p);text-align:center;cursor:pointer;transition:transform .12s}
.big:active{transform:scale(.94)}
.pic{font-size:72px;text-align:center;line-height:1}
.forms{display:flex;justify-content:center;gap:10px}
.forms span{background:var(--bg);border-radius:16px;padding:4px 16px;font-size:40px;font-weight:700;color:var(--p);min-width:64px;text-align:center}
.cap{text-align:center;font-weight:700;font-size:18px;margin:4px 0 0}
.btn{border:0;font:inherit;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(#22c58a,#17a56f);border-radius:20px;padding:14px 26px;min-width:200px;box-shadow:0 6px 0 #0f7f54;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0f7f54}
.btn.alt{background:linear-gradient(#7c5cff,#5B34D6);box-shadow:0 6px 0 #3f22a8}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 6px 0 #d9d0f7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.bub{aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-weight:700;font-size:44px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0002;transition:transform .1s,opacity .3s}
.bub:active{transform:scale(.92)}
.bub.ok{background:var(--ok)!important;transform:scale(1.08)}
.bub.gone{opacity:.25;pointer-events:none}
.shake{animation:shake .35s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.opt{border:0;border-radius:22px;background:#fff;font:inherit;font-weight:700;font-size:54px;color:var(--p);padding:14px 0;box-shadow:0 6px 0 #d9d0f7;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 #0f7f54}
.opt.no{background:var(--no);color:#fff;box-shadow:0 6px 0 #c94747}
.play{width:110px;height:110px;border-radius:50%;border:0;background:linear-gradient(#ffd45e,#ffb800);font-size:44px;box-shadow:0 7px 0 #d39100;cursor:pointer}
.trace-wrap{position:relative;width:300px;height:300px;background:#fff;border-radius:28px;box-shadow:0 6px 0 #d9d0f7;touch-action:none}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word{font-size:78px;font-weight:700;color:var(--p);min-height:110px;text-align:center;line-height:1.3}
.slots{display:flex;gap:8px;justify-content:center;direction:rtl}
.slots i{width:40px;height:8px;border-radius:9px;background:#d9d0f7}.slots i.f{background:var(--ok)}
.tile{border:0;border-radius:18px;background:#fff;font:inherit;font-weight:700;font-size:44px;color:var(--t);width:62px;height:76px;box-shadow:0 6px 0 #d9d0f7;cursor:pointer}
.tile.used{opacity:.3;pointer-events:none}
.timer{font-size:84px;font-weight:700;color:var(--p)}
.move{font-size:90px;animation:jump .6s ease-in-out infinite alternate}
.sticker{font-size:110px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.badge{display:inline-block;background:var(--y);color:#5a3b00;border-radius:99px;padding:3px 14px;font-weight:700}
.parent h2{margin:4px 0 10px;color:var(--p)}
.bar{height:12px;background:var(--bg);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.kv{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.note{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.7;margin-top:8px}
input.nm{width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:3px solid #d9d0f7;border-radius:18px;padding:12px;outline:none}
input.nm:focus{border-color:var(--p)}
/* الخريطة */
.hubhead{display:flex;align-items:center;gap:10px;margin:8px 0}
.hubhead .owl{width:64px}
.hubhead h1{margin:0;font-size:21px;color:var(--p);line-height:1.3}.hubhead p{margin:0;font-weight:700;color:#6d6684;font-size:14px}
.next{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#5B34D6,#8b5cf6);color:#fff;border:0;font:inherit;border-radius:24px;padding:14px 16px;box-shadow:0 6px 0 #3f22a8;cursor:pointer;text-align:right}
.next .L{font-size:58px;font-weight:700;line-height:1;width:78px;height:78px;border-radius:20px;background:#ffffff26;display:grid;place-items:center}
.next b{display:block;font-size:19px}.next small{font-size:14px;opacity:.9}
.quick{width:100%;border:0;font:inherit;font-weight:700;background:#fff;color:var(--p);border-radius:18px;padding:11px;box-shadow:0 4px 0 #d9d0f7;cursor:pointer}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:20px;background:#fff;font:inherit;font-weight:700;font-size:38px;color:var(--p);box-shadow:0 5px 0 #d9d0f7;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cell small{font-size:11px;letter-spacing:1px;color:#e0a000;height:12px}
.cell.cur{outline:3px solid var(--y);animation:pulse 1.6s infinite}
.cell.done{background:#eafaf3;box-shadow:0 5px 0 #b9e8d3}
.cell.lock{background:#ece7fa;color:#b6abd9;box-shadow:0 5px 0 #ddd5f5;font-size:24px}
.sec{width:100%;font-weight:700;color:#6d6684;margin:2px 0 -4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;display:none}
.hide{display:none!important}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes talk{to{transform:scaleY(.4)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes jump{to{transform:translateY(-26px)}}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#sheet{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}#app,#fx{display:none!important}
  #sheet{display:block;font-family:Cairo;direction:rtl}
  #sheet h1{color:#5B34D6;margin:0 0 4mm;font-size:24pt}
  #sheet .ln{display:flex;justify-content:space-around;border-bottom:2px solid #ddd;padding:3mm 0;font-size:58pt;font-weight:700;color:#fff;-webkit-text-stroke:1.5px #b9a8f5}
  #sheet .ln.first span:first-child{color:#5B34D6;-webkit-text-stroke:0}
  #sheet .ft{text-align:center;color:#888;margin-top:6mm}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div id="sheet"></div>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");

/* ======================= بيانات الحروف الـ28 ======================= */
// id, الحرف، اسمه، يتّصل بما بعده؟، [كلمة، صورة، حروفها] ×2
const T = "ـ";
const LET = [
 ["alif", "ا", "ألف", 0, ["أرنب", "🐰", "أرنب"], ["أسد", "🦁", "أسد"], "أ"],
 ["ba", "ب", "باء", 1, ["بطّة", "🦆", "بطة"], ["باب", "🚪", "باب"]],
 ["ta", "ت", "تاء", 1, ["تفّاحة", "🍎", "تفاحة"], ["تاج", "👑", "تاج"]],
 ["tha", "ث", "ثاء", 1, ["ثعلب", "🦊", "ثعلب"], ["ثلج", "❄️", "ثلج"]],
 ["jim", "ج", "جيم", 1, ["جمل", "🐪", "جمل"], ["جزر", "🥕", "جزر"]],
 ["ha", "ح", "حاء", 1, ["حصان", "🐴", "حصان"], ["حوت", "🐋", "حوت"]],
 ["kha", "خ", "خاء", 1, ["خروف", "🐑", "خروف"], ["خيمة", "⛺", "خيمة"]],
 ["dal", "د", "دال", 0, ["دُبّ", "🐻", "دب"], ["دجاجة", "🐔", "دجاجة"]],
 ["dhal", "ذ", "ذال", 0, ["ذُرة", "🌽", "ذرة"], ["ذباب", "🪰", "ذباب"]],
 ["ra", "ر", "راء", 0, ["ريشة", "🪶", "ريشة"], ["رجل", "🚶", "رجل"]],
 ["zay", "ز", "زاي", 0, ["زرافة", "🦒", "زرافة"], ["زهرة", "🌸", "زهرة"]],
 ["sin", "س", "سين", 1, ["سمكة", "🐟", "سمكة"], ["سيّارة", "🚗", "سيارة"]],
 ["shin", "ش", "شين", 1, ["شمس", "☀️", "شمس"], ["شجرة", "🌳", "شجرة"]],
 ["sad", "ص", "صاد", 1, ["صقر", "🦅", "صقر"], ["صاروخ", "🚀", "صاروخ"]],
 ["dad", "ض", "ضاد", 1, ["ضفدع", "🐸", "ضفدع"], ["ضوء", "💡", "ضوء"]],
 ["ta2", "ط", "طاء", 1, ["طاووس", "🦚", "طاووس"], ["طبل", "🥁", "طبل"]],
 ["dha", "ظ", "ظاء", 1, ["ظرف", "✉️", "ظرف"], ["ظفر", "💅", "ظفر"]],
 ["ayn", "ع", "عين", 1, ["عنب", "🍇", "عنب"], ["عين", "👁️", "عين"]],
 ["ghayn", "غ", "غين", 1, ["غيمة", "☁️", "غيمة"], ["غزال", "🦌", "غزال"]],
 ["fa", "ف", "فاء", 1, ["فيل", "🐘", "فيل"], ["فراشة", "🦋", "فراشة"]],
 ["qaf", "ق", "قاف", 1, ["قمر", "🌙", "قمر"], ["قطّة", "🐱", "قطة"]],
 ["kaf", "ك", "كاف", 1, ["كتاب", "📖", "كتاب"], ["كرة", "⚽", "كرة"]],
 ["lam", "ل", "لام", 1, ["ليمون", "🍋", "ليمون"], ["لعبة", "🧸", "لعبة"]],
 ["mim", "م", "ميم", 1, ["موز", "🍌", "موز"], ["مفتاح", "🔑", "مفتاح"]],
 ["nun", "ن", "نون", 1, ["نجمة", "⭐", "نجمة"], ["نحلة", "🐝", "نحلة"]],
 ["ha2", "ه", "هاء", 1, ["هديّة", "🎁", "هدية"], ["هاتف", "📱", "هاتف"]],
 ["waw", "و", "واو", 0, ["وردة", "🌹", "وردة"], ["ولد", "👦", "ولد"]],
 ["ya", "ي", "ياء", 1, ["يد", "✋", "يد"], ["يمامة", "🕊️", "يمامة"]]
].map(([id, ch, name, con, w1, w2, vch], i) => {
  const c = vch || ch;
  return {
    i, id, ch, name, con,
    forms: con ? [ch + T, T + ch + T, T + ch] : [ch, null, T + ch],
    vow: [c + "َ", c + "ُ", c + "ِ"],
    w: [w1, w2].map(([t, e, l]) => ({ t, e, l: [...l] }))
  };
});
const SIM = ["بتثني", "جحخ", "دذ", "رز", "سش", "صض", "طظ", "عغ", "فق", "كل"];
const simOf = (ch) => (SIM.find((s) => s.includes(ch)) || "").split("").filter((x) => x !== ch);
const ALLCH = LET.map((l) => l.ch);
const NAMES = Object.fromEntries(LET.map((l) => [l.ch, "ال" + l.name.replace(/^أ/, "أ")]));

/* ======================= الحفظ ======================= */
const KEY = "zad-learn-v2";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
let S = Object.assign({ name: "", stars: 0, sfx: true, voice: true, prog: {} }, load());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const P = (id) => (S.prog[id] = S.prog[id] || { best: 0, runs: 0, last: null, seen: 0 });
const unlocked = (i) => i === 0 || P(LET[i - 1].id).best >= 60;
const doneCount = () => LET.filter((l) => P(l.id).best >= 60).length;
const nextIdx = () => { const i = LET.findIndex((l, k) => P(l.id).best < 60 && unlocked(k)); return i < 0 ? LET.length - 1 : i; };
const dueList = () => LET.filter((l) => { const p = P(l.id); return p.best >= 60 && (p.best < 85 || Date.now() - p.seen > 3 * 864e5); });
let R = null, LT = null, MODE = "lesson";
const newRun = () => ({ start: Date.now(), find: { hit: 0, miss: 0 }, trace: { tries: 0 }, sound: { ok: 0, total: 0 }, build: { miss: 0 } });

/* ======================= المؤثرات الصوتية ======================= */
let AC = null;
const ac = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tone(f, dur = .12, type = "sine", vol = .16, when = 0, slide = 0) {
  if (!S.sfx) return;
  try {
    const c = ac(), t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
function noise(dur = .15, vol = .08, f0 = 1800, f1 = 300, when = 0) {
  if (!S.sfx) return;
  try {
    const c = ac(), t = c.currentTime + when, n = c.sampleRate * dur | 0, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; fl.type = "bandpass"; fl.Q.value = 1.2; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(c.destination); s.start(t);
  } catch {}
}
const sfx = {
  tap: () => tone(620, .05, "triangle", .08, 0, -120),
  pop: () => { tone(380, .09, "sine", .16, 0, 520); noise(.05, .05, 3000, 900); },
  ok: () => { tone(660, .1, "triangle", .15); tone(880, .1, "triangle", .15, .09); tone(1320, .2, "triangle", .13, .18); },
  no: () => { tone(260, .16, "sawtooth", .07, 0, -90); tone(200, .2, "sawtooth", .06, .12, -60); },
  star: () => { tone(988, .12, "sine", .15); tone(1319, .22, "sine", .14, .1); },
  whoosh: () => noise(.28, .06, 400, 3200),
  tick: () => tone(900, .05, "square", .05),
  place: () => { tone(300, .06, "square", .06, 0, 200); tone(600, .08, "triangle", .1, .05); },
  sparkle: () => [0, 1, 2, 3, 4].forEach((k) => tone(1500 + Math.random() * 1800, .12, "sine", .07, k * .06)),
  win: () => { [523, 659, 784, 1046].forEach((f, k) => tone(f, .16, "triangle", .15, k * .11)); tone(1318, .5, "triangle", .14, .46); tone(784, .5, "sine", .08, .46); setTimeout(sfx.sparkle, 480); },
  level: () => { [392, 523, 659, 784, 1046, 1318].forEach((f, k) => tone(f, .14, "square", .07, k * .09)); setTimeout(sfx.sparkle, 600); }
};

/* ======================= الصوت: تسجيلات + صوت الجهاز احتياطاً ======================= */
let MAN = {}, curAudio = null;
const AUD = new Audio(); AUD.preload = "auto";
const SIL = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
let unlockedA = false;
const unlockAudio = () => {
  try { ac().resume(); } catch {}
  if (unlockedA) return; unlockedA = true;
  try { AUD.src = SIL; const p = AUD.play(); p && p.catch(() => { unlockedA = false; }); } catch { unlockedA = false; }
};
["pointerdown", "touchstart", "click"].forEach((e) => document.addEventListener(e, unlockAudio, { passive: true, capture: true }));
fetch("audio/manifest.json?v=2").then((r) => r.ok ? r.json() : {}).then((m) => { MAN = m || {}; }).catch(() => {});
let VOICE = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  VOICE = vs.find((v) => /^ar/i.test(v.lang) && /Majed|Maged|Laila|Hamed|Tarik|Google/i.test(v.name)) || vs.find((v) => /^ar/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastSpeech = ["", ""];
const BUF = {};
function preload(id) {
  if (!S.voice) return;
  ["name", "intro", "fa", "da", "ka", "w1", "w2"].forEach((k) => { const f = MAN[id + "." + k]; if (f && !BUF[f]) loadBuf(f).catch(() => {}); });
}
async function loadBuf(file) {
  if (BUF[file]) return BUF[file];
  const c = ac(), ab = await (await fetch("audio/" + file + "?v=2")).arrayBuffer();
  return (BUF[file] = await new Promise((ok, no) => { const r = c.decodeAudioData(ab, ok, no); if (r && r.then) r.then(ok, no); }));
}
let curSrc = null;
async function playClip(file, onEnd, onFail) {
  try {
    const c = ac(); if (c.state === "suspended") await c.resume();
    await loadBuf(file);
    if (c.state !== "running") throw new Error("ctx");
    const src = c.createBufferSource(); src.buffer = BUF[file]; if (BUF[file].duration > 3.5) src.playbackRate.value = 1.15; src.connect(c.destination);
    src.onended = () => { if (curSrc === src) curSrc = null; onEnd(); };
    curSrc = src; src.start();
  } catch (e) { onFail(); }
}
function stopVoice() { if (curSrc) { try { curSrc.onended = null; curSrc.stop(); } catch {} curSrc = null; } try { speechSynthesis.cancel(); } catch {} if (curAudio) { try { curAudio.pause(); } catch {} curAudio = null; } }
function speak(text, key) {
  lastSpeech = [text, key]; const tok = SCR;
  const owl = $(".owl"), talk = (on) => owl && owl.classList.toggle("talk", on);
  stopVoice();
  return new Promise((res0) => {
    const res = () => { if (tok === SCR) res0(); };
    if (!S.voice) { setTimeout(res, 250); return; }

      talk(true); setTimeout(end, 20000);

        // احتياط: عنصر الصوت العادي ثم صوت الجهاز

}
function speakTTS(text, res) {

const fx = $("#fx"), fc = fx.getContext("2d"); let parts = [], raf = 0;
function confetti(n = 70) {
  const d = 1; fx.style.display = "block";
  fx.width = innerWidth * d; fx.height = innerHeight * d; fc.setTransform(d, 0, 0, d, 0, 0);
  const cols = ["#5B34D6", "#ffc83d", "#1fb57a", "#ff6b6b", "#3c9df0"];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, s: 6 + Math.random() * 6, c: cols[i % 5], r: Math.random() * 6, life: 90 });
  if (!raf) loop();
}
function loop() {
  fc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life-- > 0);
  parts.forEach((p) => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; fc.save(); fc.translate(p.x, p.y); fc.rotate(p.r); fc.fillStyle = p.c; fc.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fc.restore(); });
  if (parts.length) raf = requestAnimationFrame(loop); else { fc.clearRect(0, 0, innerWidth, innerHeight); fx.style.display = "none"; raf = 0; }
}

async function trace() {
  shell(3, `
    <div class="trace-wrap" id="tw"><canvas id="cg"></canvas><canvas id="cd"></canvas></div>
    <div class="row"><button class="btn ghost" id="clr">↺ امسح</button><button class="btn" id="chk">تمّ ✔</button></div>`);
  say(`الآن ارسم حرف ${LT.name} بإصبعك فوق الحرف الرمادي. ابدأ من النقطة الخضراء.`, "trace");
  await document.fonts.load("700 230px Cairo").catch(() => {});
  const W = 300, d = Math.min(2, devicePixelRatio || 1);
  const cg = $("#cg"), cd = $("#cd");
  if (!cg || !cd) return;
  [cg, cd].forEach((c) => { c.width = W * d; c.height = W * d; });
  const g = cg.getContext("2d"), x = cd.getContext("2d");
  g.setTransform(d, 0, 0, d, 0, 0); x.setTransform(d, 0, 0, d, 0, 0);
  // قياس الحرف وتكبيره ليملأ اللوحة
  const mc = document.createElement("canvas").getContext("2d");
  mc.font = "700 200px Cairo"; const m = mc.measureText(LT.ch);
  const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const sc = Math.min(1.6, 215 / Math.max(gw, gh * 1.05, 1)), fs = 200 * sc;
  const ox = W / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 * sc, oy = W / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2 * sc;
  const drawL = (ctx, color, stroke = 0) => { ctx.font = `700 ${fs}px Cairo`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = color; ctx.fillText(LT.ch, ox, oy); if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = "round"; ctx.strokeText(LT.ch, ox, oy); } };
  drawL(g, "#e4dcff");
  const mk = (stroke) => { const c = document.createElement("canvas"); c.width = c.height = W; const t = c.getContext("2d"); drawL(t, "#000", stroke); return t.getImageData(0, 0, W, W).data; };
  const mask = mk(0), wide = mk(34);
  window.__zad.pts = []; for (let yy = 0; yy < W; yy += 8) for (let xx = 0; xx < W; xx += 8) if (mask[(yy * W + xx) * 4 + 3] > 100) window.__zad.pts.push([xx, yy]);
  let sx = 0, sy = 0;
  for (let y = 0; y < W && !sx; y++) for (let xx = W - 1; xx >= 0; xx--) if (mask[(y * W + xx) * 4 + 3] > 100) { sx = xx; sy = y; break; }
  g.fillStyle = "#1fb57a"; g.beginPath(); g.arc(sx - 4, sy + 14, 13, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = "700 11px Cairo"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("ابدأ", sx - 4, sy + 15);
  let drawing = false, lastP = null;
  x.lineWidth = 22; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#5B34D6";
  let rc = cd.getBoundingClientRect(); const pos = (e) => { const r = rc; return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; };
  cd.onpointerdown = (e) => { rc = cd.getBoundingClientRect(); drawing = true; lastP = pos(e); x.beginPath(); x.arc(lastP[0], lastP[1], 11, 0, 7); x.fillStyle = "#5B34D6"; x.fill(); cd.setPointerCapture(e.pointerId); sfx.tap(); };
  cd.onpointermove = (e) => { if (!drawing) return; const p = pos(e); x.beginPath(); x.moveTo(lastP[0], lastP[1]); x.lineTo(p[0], p[1]); x.stroke(); lastP = p; };
  cd.onpointerup = cd.onpointercancel = () => { drawing = false; };
  $("#clr").onclick = () => { x.clearRect(0, 0, W, W); sfx.pop(); };
  $("#chk").onclick = async () => {
    R.trace.tries++;
    const u = document.createElement("canvas"); u.width = u.height = W; u.getContext("2d").drawImage(cd, 0, 0, W, W);
    const ud = u.getContext("2d").getImageData(0, 0, W, W).data;
    let M = 0, C = 0, U = 0, Pm = 0;

      if (b) { U++; if (w) Pm++; }
    }
    const cover = M ? C / M : 0, prec = U ? Pm / U : 0;
    if (cover > .5 && prec > .6) {
      sfx.win(); star(2); confetti(80);
      await sayQ(`${praise()} كتبت حرف ${LT.name} بنفسك يا ${nm()}.`, "p.trace");
      brk();
    } else {
      sfx.no();
      say(cover <= .5 ? "قرّبت! ارسم فوق الحرف كله، وانتبه للنقاط." : "حاول أن تبقى داخل الحرف الرمادي. هيا مرة أخرى!", cover <= .5 ? "t.more" : "t.stay");
      x.clearRect(0, 0, W, W);
    }
  };
}

    <div class="pic">${W0.e}</div>
    <div class="word" id="wd">&nbsp;</div>
    <div class="slots">${W0.l.map(() => "<i></i>").join("")}</div>
    <div class="row" id="tl">${tiles.map((t, i) => `<button class="tile" data-i="${i}">${t}</button>`).join("")}</div>`);
  say(`ركّب كلمة ${W0.t}. اضغط على الحروف بالترتيب.`, LT.id + ".w" + (w + 1));
  app.querySelectorAll(".tile").forEach((b) => b.onclick = async () => {
    const need = W0.l[got.length];
    if (b.textContent === need) {
      got.push(need); b.classList.add("used"); sfx.place();
      $("#wd").textContent = got.join(""); app.querySelectorAll(".slots i")[got.length - 1].classList.add("f");
      if (got.length === W0.l.length) {
        sfx.win(); star(2); confetti(60); app.querySelectorAll(".tile").forEach((t) => t.onclick = null);
        await say(`${W0.t}! قرأتها بنفسك.`, LT.id + ".w" + (w + 1));
        if (w < LT.w.length - 1) build(w + 1); else finish();
      }
    } else { sfx.no(); R.build.miss++; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); const o = LET.find((l) => l.ch === need); say(`لا، نحتاج الآن حرف ${o ? o.name : need}.`, "need." + (o ? o.id : "")); }
  });
}

/* ======================= 7) النتيجة ======================= */
function score(r) {
  const fAcc = r.find.hit / Math.max(1, r.find.hit + r.find.miss);
  const sAcc = r.sound.ok / Math.max(1, r.sound.total);
  const bAcc = MODE === "review" ? null : 1 - Math.min(1, r.build.miss / 6);
  const tAcc = MODE === "review" ? null : r.trace.tries <= 1 ? 1 : r.trace.tries === 2 ? .8 : .6;
  const arr = [fAcc, sAcc, bAcc, tAcc].filter((v) => v !== null);
  return { fAcc, sAcc, bAcc, tAcc, all: Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 100), mins: Math.max(1, Math.round((Date.now() - r.start) / 60000)) };
}
async function finish() {
  const sc = score(R), p = P(LT.id), was = p.best >= 60;
  const keep = MODE === "review" && p.last ? { ...p.last } : {};
  p.runs++; p.seen = Date.now(); p.last = { ...keep, ...Object.fromEntries(Object.entries(sc).filter(([, v]) => v !== null)), date: new Date().toISOString() };
  if (MODE === "review") p.best = Math.max(p.best, Math.round((p.best * 2 + sc.all) / 3)); else p.best = Math.max(p.best, sc.all);
  save();
  const pass = p.best >= 60, nextL = LET[LT.i + 1];
  const body = pass ? `
    <div class="sticker">${LT.w[0].e}</div>
    <div class="card" style="text-align:center">
      <span class="badge">${was ? "تدريب ناجح" : `ملصق جديد: ${LT.w[0].t}`}</span>
      <h2 style="margin:10px 0 4px;color:var(--p)">أتقنت حرف ${LT.name}!</h2>
      <p style="margin:0;font-weight:700">نتيجتك ${sc.all}% ${stars3(p.best)} · ⭐ ${S.stars}</p>
      ${!was && nextL ? `<p style="margin:8px 0 0;font-weight:700;color:var(--ok)">🔓 فتحت حرف ${nextL.name} ${nextL.ch}</p>` : ""}
    </div>` : `
    <div class="sticker">💪</div>
    <div class="card" style="text-align:center">
      <h2 style="margin:0 0 4px;color:var(--p)">قرّبت جداً!</h2>
      <p style="margin:0;font-weight:700">نتيجتك ${sc.all}% — نعيد الدرس لنتقن الحرف ونفتح الحرف التالي.</p>
    </div>`;
  shell(7, `${body}
    ${MODE === "lesson" ? '<button class="btn alt" id="pr">🖨️ ورقة اليوم</button>' : ""}
    ${pass && nextL && !was ? `<button class="btn" id="nxt">الحرف التالي: ${nextL.ch} ◀</button>` : ""}
    <button class="btn ghost" id="again">${pass ? "الخريطة" : "أعد الدرس"}</button>`);
  if ($("#pr")) $("#pr").onclick = printSheet;
  if ($("#nxt")) $("#nxt").onclick = () => begin(LT.i + 1, "lesson");
  $("#again").onclick = () => pass ? hub() : begin(LT.i, "lesson");
  if (pass) { confetti(120); sfx.level(); } else sfx.ok();
  say(pass ? `مبروك يا ${nm()}! أنت الآن تعرف حرف ${LT.name}.` : `لا بأس يا ${nm()}! كل مرة تتحسّن أكثر. هيا نحاول مرة أخرى.`, pass ? "done.pass" : "done.retry");
}
function printSheet() {
  const [a, b, c] = LT.forms, w = LT.w;
  $("#sheet").innerHTML = `
  <h1>ورقة اليوم: حرف ${LT.name} ${LT.ch} — ${S.name}</h1>
  <p>اكتب الحرف فوق الخطوط، ثم لوّن الصور ${w[0].e} ${w[1].e}.</p>
  <div class="ln first">${Array(5).fill(`<span>${LT.ch}</span>`).join("")}</div>
  <div class="ln">${[a, b, b, c, c].map((f) => `<span>${f || LT.ch}</span>`).join("")}</div>
  <div class="ln">${[w[0].t, w[1].t, w[0].t].map((t) => `<span style="font-size:42pt">${t}</span>`).join("")}</div>
  <div class="ln">${[0, 1, 2, 0, 1].map((k) => `<span>${LT.vow[k]}</span>`).join("")}</div>
  <div class="ft">زاد التعليمية · تعلّم والعب</div>`;
  window.print();
}

/* ======================= ولي الأمر ======================= */
function gate() {
  const a = 3 + (Math.random() * 5 | 0), b = 4 + (Math.random() * 5 | 0);
  app.innerHTML = `<div class="top"><button class="icon-btn" id="home">🏠</button></div>
  <div class="stage"><div class="card" style="text-align:center">
    <h2 style="margin:0 0 6px;color:var(--p)">لولي الأمر فقط</h2>
    <p style="margin:0 0 12px;font-weight:700">كم ناتج ${a} × ${b}؟</p>
    <input class="nm" id="ga" inputmode="numeric" maxlength="3">
    <button class="btn alt" id="gok" style="margin-top:14px">دخول</button></div></div>`;
  $("#home").onclick = start;
  $("#gok").onclick = () => { if (+$("#ga").value === a * b) parent(); else { $("#ga").value = ""; sfx.no(); $("#ga").classList.add("shake"); setTimeout(() => $("#ga").classList.remove("shake"), 400); } };
}
function parent() {
  const lvl = (v) => (v >= .85 ? "متقن ✅" : v >= .6 ? "جيد 👍" : "يحتاج تكرار 🔁");
  const done = LET.filter((l) => P(l.id).runs > 0);
  const best = done.filter((l) => P(l.id).best >= 85), weak = done.filter((l) => P(l.id).best < 85);
  const avg = (k) => { const v = done.map((l) => P(l.id).last && P(l.id).last[k]).filter((x) => typeof x === "number"); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const skills = [["التعرّف على الحرف بين حروف تشبهه", avg("fAcc")], ["كتابة الحرف بالتتبّع", avg("tAcc")], ["تمييز أصوات الحركات", avg("sAcc")], ["تركيب الكلمات", avg("bAcc")]].filter((s) => s[1] !== null);
  const mins = done.reduce((a, l) => a + (P(l.id).last ? P(l.id).last.mins || 0 : 0), 0);
  const tip = !done.length ? "" : weak.length ? `ننصح بإعادة تدريب: ${weak.slice(0, 4).map((l) => l.ch).join("، ")} (٥ دقائق يومياً تكفي).` : doneCount() >= 28 ? "ما شاء الله! أتقن الطفل الحروف كلها، وهو جاهز للقراءة." : `أداء ممتاز! الحرف التالي: ${LET[nextIdx()].ch}.`;
  const report = done.length ? `تقرير «تعلّم والعب» – زاد التعليمية\nالطفل: ${S.name}\nالحروف المتقنة: ${doneCount()} من ٢٨\n${done.map((l) => `${l.ch}: ${P(l.id).best}%`).join(" · ")}\n${skills.map((s) => `• ${s[0]}: ${lvl(s[1])}`).join("\n")}\nالنجوم: ${S.stars}\n${tip}` : "";
  app.innerHTML = `<div class="top"><button class="icon-btn" id="home">🏠</button><span class="badge">تقرير ولي الأمر</span></div>
  <div class="stage" style="justify-content:flex-start"><div class="card parent">
    ${done.length ? `<h2>${S.name}</h2>
    <div class="kv"><span>الحروف المتقنة</span><span>${doneCount()} / ٢٨</span></div><div class="bar"><i style="width:${Math.round(doneCount() / 28 * 100)}%"></i></div>
    ${skills.map((s) => `<div class="kv"><span>${s[0]}</span><span>${lvl(s[1])}</span></div><div class="bar"><i style="width:${Math.round(s[1] * 100)}%"></i></div>`).join("")}
    <div class="kv"><span>حروف جرّبها</span><span>${done.map((l) => l.ch).join(" ")}</span></div>
    <div class="kv" style="margin-top:6px"><span>النجوم</span><span>⭐ ${S.stars}</span></div>
    <div class="kv" style="margin-top:6px"><span>مدة التعلّم التقريبية</span><span>${mins} دقيقة</span></div>
    <div class="note">💡 ${tip}${best.length ? `<br>أتقن: ${best.map((l) => l.ch).join("، ")}` : ""}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="sh">📲 أرسل التقرير واتساب</button></div>`
    : `<h2>لا توجد نتائج بعد</h2><p>بعد أن يكمل طفلك أول درس يظهر هنا تقرير مفصّل بما أتقنه وما يحتاج تكراراً.</p>`}
  </div></div>`;
  $("#home").onclick = start;
  const sh = $("#sh"); if (sh) sh.onclick = () => { location.href = "https://wa.me/?text=" + encodeURIComponent(report); };
}

window.__zad = { LET, S, begin, hub, start, AUD, brk };
start();
})();
</script>
