<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>تعلّم والعب · الحروف العربية | زاد التعليمية</title>
<meta name="description" content="مسار تفاعلي لتعليم الحروف العربية الـ28 للأطفال: لعب وتتبّع وأصوات وتركيب كلمات، مع تقرير لولي الأمر.">
<meta name="theme-color" content="#5B34D6">
<link rel="icon" href="../images/icons/favicon-64.png" type="image/png">
<link rel="preload" href="../fonts/cairo-bold.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:Cairo;src:url(../fonts/cairo-regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(../fonts/cairo-bold.woff) format("woff");font-weight:700;font-display:swap}
:root{--p:#5B34D6;--p2:#8b5cf6;--bg:#f3efff;--t:#1B1430;--ok:#1fb57a;--no:#ff6b6b;--y:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.prog{flex:1;height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px #0001}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),#ff9f1c);border-radius:99px;transition:width .5s}
.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #d9d0f7;cursor:pointer;font-family:inherit}
.stars{background:#fff;border-radius:14px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 #d9d0f7;white-space:nowrap}
.guide{display:flex;align-items:flex-end;gap:8px;margin:12px 0 10px}
.owl{width:84px;flex:none;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
.owl.talk .beak{animation:talk .22s ease-in-out infinite alternate}
.owl .lid{transform-origin:center;animation:blink 4s infinite}
.bubble{position:relative;flex:1;background:#fff;border-radius:20px 20px 6px 20px;padding:12px 14px;font-size:17px;font-weight:700;line-height:1.55;box-shadow:0 4px 0 #d9d0f7;min-height:58px}
.bubble .rep{position:absolute;left:8px;bottom:-14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:15px;box-shadow:0 3px 0 #3f22a8;cursor:pointer}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 #d9d0f7;padding:18px;width:100%}
.big{font-size:150px;line-height:1.25;margin-bottom:18px;font-weight:700;color:var(--p);text-align:center;cursor:pointer;transition:transform .12s}
.big:active{transform:scale(.94)}
.pic{font-size:72px;text-align:center;line-height:1}
.forms{display:flex;justify-content:center;gap:10px}
.forms span{background:var(--bg);border-radius:16px;padding:4px 16px;font-size:40px;font-weight:700;color:var(--p);min-width:64px;text-align:center}
.cap{text-align:center;font-weight:700;font-size:18px;margin:4px 0 0}
.btn{border:0;font:inherit;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(#22c58a,#17a56f);border-radius:20px;padding:14px 26px;min-width:200px;box-shadow:0 6px 0 #0f7f54;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0f7f54}
.btn.alt{background:linear-gradient(#7c5cff,#5B34D6);box-shadow:0 6px 0 #3f22a8}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 6px 0 #d9d0f7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.bub{aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-weight:700;font-size:44px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0002;transition:transform .1s,opacity .3s}
.bub:active{transform:scale(.92)}
.bub.ok{background:var(--ok)!important;transform:scale(1.08)}
.bub.gone{opacity:.25;pointer-events:none}
.shake{animation:shake .35s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.opt{border:0;border-radius:22px;background:#fff;font:inherit;font-weight:700;font-size:54px;color:var(--p);padding:14px 0;box-shadow:0 6px 0 #d9d0f7;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 #0f7f54}
.opt.no{background:var(--no);color:#fff;box-shadow:0 6px 0 #c94747}
.play{width:110px;height:110px;border-radius:50%;border:0;background:linear-gradient(#ffd45e,#ffb800);font-size:44px;box-shadow:0 7px 0 #d39100;cursor:pointer}
.trace-wrap{position:relative;width:var(--tw,300px);height:var(--tw,300px);max-width:100%;background:#fff;border-radius:28px;box-shadow:0 6px 0 #d9d0f7;touch-action:none}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word{font-size:78px;font-weight:700;color:var(--p);min-height:110px;text-align:center;line-height:1.3}
.slots{display:flex;gap:8px;justify-content:center;direction:rtl}
.slots i{width:40px;height:8px;border-radius:9px;background:#d9d0f7}.slots i.f{background:var(--ok)}
.tile{border:0;border-radius:18px;background:#fff;font:inherit;font-weight:700;font-size:44px;color:var(--t);width:62px;height:76px;box-shadow:0 6px 0 #d9d0f7;cursor:pointer}
.tile.used{opacity:.3;pointer-events:none}
.timer{font-size:84px;font-weight:700;color:var(--p)}
.move{font-size:90px;animation:jump .6s ease-in-out infinite alternate}
.sticker{font-size:110px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.badge{display:inline-block;background:var(--y);color:#5a3b00;border-radius:99px;padding:3px 14px;font-weight:700}
.parent h2{margin:4px 0 10px;color:var(--p)}
.bar{height:12px;background:var(--bg);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.kv{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.note{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.7;margin-top:8px}
input.nm{width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:3px solid #d9d0f7;border-radius:18px;padding:12px;outline:none}
input.nm:focus{border-color:var(--p)}
/* الخريطة */
.hubhead{display:flex;align-items:center;gap:10px;margin:8px 0}
.hubhead .owl{width:64px}
.hubhead h1{margin:0;font-size:21px;color:var(--p);line-height:1.3}.hubhead p{margin:0;font-weight:700;color:#6d6684;font-size:14px}
.next{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#5B34D6,#8b5cf6);color:#fff;border:0;font:inherit;border-radius:24px;padding:14px 16px;box-shadow:0 6px 0 #3f22a8;cursor:pointer;text-align:right}
.next .L{font-size:58px;font-weight:700;line-height:1;width:78px;height:78px;border-radius:20px;background:#ffffff26;display:grid;place-items:center}
.next b{display:block;font-size:19px}.next small{font-size:14px;opacity:.9}
.quick{width:100%;border:0;font:inherit;font-weight:700;background:#fff;color:var(--p);border-radius:18px;padding:11px;box-shadow:0 4px 0 #d9d0f7;cursor:pointer}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:20px;background:#fff;font:inherit;font-weight:700;font-size:38px;color:var(--p);box-shadow:0 5px 0 #d9d0f7;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cell small{font-size:11px;letter-spacing:1px;color:#e0a000;height:12px}
.cell.cur{outline:3px solid var(--y);animation:pulse 1.6s infinite}
.cell.done{background:#eafaf3;box-shadow:0 5px 0 #b9e8d3}
.cell.lock{background:#ece7fa;color:#b6abd9;box-shadow:0 5px 0 #ddd5f5;font-size:24px}
.sec{width:100%;font-weight:700;color:#6d6684;margin:2px 0 -4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;display:none}
.hide{display:none!important}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes talk{to{transform:scaleY(.4)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes jump{to{transform:translateY(-26px)}}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}


.stats{display:flex;gap:8px;justify-content:center;width:100%}
.stats span{background:#fff;border-radius:99px;padding:5px 14px;font-weight:700;box-shadow:0 3px 0 #d9d0f7}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.gm{position:relative;border:0;font:inherit;font-weight:700;background:#fff;color:var(--t);border-radius:22px;padding:12px 8px;box-shadow:0 5px 0 #d9d0f7;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px}
.gm b{font-size:38px;line-height:1.1}.gm small{font-size:12px;color:#6d6684}.gm.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px}
.gm.wide small{margin-inline-start:6px}.gm em{font-style:normal;background:var(--no);color:#fff;border-radius:99px;padding:0 9px;font-size:14px}
.gm:active{transform:translateY(3px);box-shadow:0 2px 0 #d9d0f7}
.isl{width:100%}.isl .ih{font-weight:700;color:var(--p);margin:6px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.isl .ih small{color:#6d6684}.isl.lk{opacity:.55}
.isl .map{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.isl .cell{font-size:26px;border-radius:14px;min-width:0;padding:0}.isl .cell small{font-size:9px;height:10px}
@media (min-width:640px){.games{grid-template-columns:repeat(4,1fr)}.gm.wide{grid-column:1/-1}.isl .cell{font-size:40px}.isl .cell small{font-size:12px}}
/* ===== تحفيز وتخصيص ===== */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;position:relative;box-shadow:0 2px 0 rgba(91,52,214,.18);flex:none}
.av i{position:absolute;font-style:normal;line-height:1}
.hubhead{display:flex;align-items:center;gap:12px}.avb{border:0;background:none;padding:0;cursor:pointer}
.xp{height:10px;border-radius:9px;background:#e9e3fb;overflow:hidden;margin:6px 0 2px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#8b6cf0,#5B34D6);border-radius:9px;transition:width .4s}
.xl{font-weight:700;color:#6d6684}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2b1d63;color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.wk{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 0 rgba(91,52,214,.12);text-align:center}
.wk .wh{font-weight:800;color:var(--p);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.wh small{color:#6d6684}
.wd{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.wd span{width:34px;height:34px;border-radius:50%;background:#eee9fb;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8d85a8}.wd span.on{background:var(--p);color:#fff}
.chip{border:0;background:#fff3c4;border-radius:20px;padding:4px 12px;font:inherit;font-weight:800;cursor:pointer}
.bdg{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:12px 0}.bdg .b{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 rgba(91,52,214,.12)}.bdg .b span{font-size:34px}.bdg .b small{font-weight:700}.bdg .b.off{opacity:.45}
.avg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}.pk{width:54px;height:54px;border-radius:50%;border:3px solid transparent;background:#fff;font-size:28px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 0 rgba(91,52,214,.15)}.pk.on{border-color:var(--p)}.pk.lk{opacity:.5}.pk small{font-size:11px;font-weight:800}
.sec{font-weight:800;color:var(--p);margin:10px 0 6px;text-align:center}
.kids{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.kid{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid transparent;border-radius:20px;padding:12px 14px;font:inherit;cursor:pointer;min-width:116px;box-shadow:0 2px 0 rgba(91,52,214,.15)}.kid.on{border-color:var(--p)}.kid small{color:#6d6684;font-weight:700}
.tu{position:fixed;inset:0;background:rgba(43,29,99,.92);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button{border:2px solid #e3dcf9;background:#fff;border-radius:20px;padding:4px 12px 4px 8px;font:inherit;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}.tabs .on{border-color:var(--p);background:#f1ecff}
.parent h2 small{font-size:14px;color:#6d6684;font-weight:700}
.sec2{font-weight:800;color:var(--p);margin:16px 0 6px}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.lgrid span{background:#eee9fb;border-radius:9px;text-align:center;padding:5px 0;font-weight:800;font-size:18px;color:#8d85a8}.lgrid .g{background:#c9f3d8;color:#137a3a}.lgrid .y{background:#ffe9a8;color:#8a5a00}
.lg{display:flex;gap:10px;margin-top:6px;font-weight:700;color:#6d6684}.lg b{display:inline-block;width:12px;height:12px;border-radius:4px;background:#eee9fb;vertical-align:-1px}.lg b.g{background:#c9f3d8}.lg b.y{background:#ffe9a8}
.wds{display:flex;flex-wrap:wrap;gap:6px}.wds span{background:#f1ecff;border-radius:14px;padding:3px 12px;font-weight:800;color:var(--p)}
.wb{display:flex;gap:6px;align-items:flex-end;justify-content:space-between;margin:8px 0}.wb div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}.wb i{width:70%;background:#c9bcf5;border-radius:6px 6px 0 0}.wb i.t{background:var(--p)}.wb small{font-weight:700;color:#6d6684;font-size:11px}
.st{display:block;font-weight:800;margin:10px 0}.st select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:12px;border:2px solid #e3dcf9;font:inherit;background:#fff}
/* ===== تعلّم أكثر ===== */
.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;cursor:pointer}.lc .bg{font-size:96px;line-height:1.1;font-weight:800;color:var(--p)}.lc .sw{width:110px;height:110px;border-radius:50%;border:4px solid #e3dcf9}.lc .cnt{font-size:22px;max-width:300px;text-align:center;line-height:1.3}
.lw{font-size:38px;font-weight:800;color:var(--p);text-align:center}.ls{font-size:22px;font-weight:700;color:#6d6684;text-align:center;margin-bottom:10px;direction:ltr}
.mem{display:grid;gap:8px;width:100%;max-width:460px;margin:0 auto}.mc{position:relative;aspect-ratio:1;border:0;border-radius:16px;background:var(--p);font-size:34px;cursor:pointer;perspective:600px;padding:0;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}.mc .b{display:none;font-size:40px}.mc.open,.mc.done{background:#fff}.mc.open .f,.mc.done .f{display:none}.mc.open .b,.mc.done .b{display:inline}.mc.done{background:#c9f3d8}
.oddg{display:grid;gap:8px;width:100%;max-width:460px;margin:0 auto}.od{aspect-ratio:1;border:0;border-radius:16px;background:#fff;font-size:44px;cursor:pointer;box-shadow:0 2px 0 rgba(91,52,214,.15);font-family:inherit;font-weight:800;color:var(--p);padding:0}.od.sm{font-size:30px}.od.ok{background:#c9f3d8}.od.no{background:#ffd5d5;animation:shake .4s}
.ordg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.og{border:3px solid transparent;border-radius:16px;background:#fff;padding:8px 10px;min-width:96px;font-size:28px;line-height:1.3;cursor:pointer;position:relative;box-shadow:0 2px 0 rgba(91,52,214,.15)}.og span{display:block;max-width:150px;word-break:break-all}.og.ok{background:#c9f3d8;border-color:#43a047}.og.ok::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:var(--p);color:#fff;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}.og.no{background:#ffd5d5}
/* ===== قصص ومتجر ===== */
.scn{font-size:110px;line-height:1.1;text-align:center;animation:flt 3s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-8px)}}
.stx{min-height:90px;display:flex;align-items:center;justify-content:center}
.song{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px;margin:0 auto}.sl{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 14px;font-size:20px;opacity:.6;transition:.2s}.sl span{font-size:30px}.sl.on{opacity:1;background:#f1ecff;transform:scale(1.03);box-shadow:0 0 0 3px var(--p)}
.shi{border:3px solid transparent;background:#fff;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(91,52,214,.15)}.shi span{font-size:40px}.shi small{color:#6d6684;font-weight:700}.shi b{color:var(--p)}.shi.no{opacity:.55}.shi.own{background:#e6f7ec}
.gm.lk{opacity:.5}
.plan{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:460px;background:#fff;border:3px solid #e3dcf9;border-radius:18px;padding:14px 18px;font:inherit;font-size:20px;font-weight:800;color:var(--p);cursor:pointer;position:relative;box-shadow:0 2px 0 rgba(91,52,214,.15)}.plan em{position:absolute;top:-10px;left:14px;background:#fdd835;color:#2b1d63;font-style:normal;font-size:12px;padding:2px 10px;border-radius:12px}
/* ===== متجاوب: هاتف / تابلت / كمبيوتر ===== */
@media (min-width:640px){
  :root{--tw:min(380px,46vh)}
  #app{max-width:700px;padding:16px 24px 24px}
  .owl{width:104px}.hubhead .owl{width:80px}
  .bubble{font-size:21px;padding:16px 20px;border-radius:24px 24px 8px 24px}
  .hubhead h1{font-size:27px}.hubhead p{font-size:16px}
  .big{font-size:190px}.pic{font-size:92px}
  .forms span{font-size:50px;min-width:80px;padding:6px 20px}
  .cap{font-size:22px}
  .btn{font-size:23px;padding:16px 34px;min-width:240px}
  .grid{gap:18px;max-width:min(600px,56vh);margin:0 auto}.bub{font-size:56px}
  .opts{gap:18px}.opt{font-size:68px;padding:18px 0}
  .play{width:136px;height:136px;font-size:54px}
  .word{font-size:100px;min-height:136px}
  .tile{width:78px;height:94px;font-size:54px}
  .timer{font-size:110px}.move{font-size:120px}.sticker{font-size:140px}
  .map{grid-template-columns:repeat(6,1fr);gap:14px}
  .cell{font-size:46px;border-radius:24px}.cell small{font-size:13px}
  .next b{font-size:23px}.next .L{font-size:70px;width:96px;height:96px}
  .card{padding:26px;border-radius:30px}
  .icon-btn{width:48px;height:48px;font-size:23px}
  input.nm{font-size:26px;padding:16px}
}
@media (min-width:1024px){
  :root{--tw:min(440px,50vh)}
  #app{max-width:900px;padding:20px 32px 32px}
  .owl{width:120px}.hubhead .owl{width:92px}
  .bubble{font-size:23px}
  .grid{max-width:min(560px,56vh)}.opts{max-width:560px;margin:0 auto}
  .map{grid-template-columns:repeat(7,1fr)}
  .btn,.quick,.next{transition:transform .15s}
  .btn:hover,.quick:hover,.cell:not(.lock):hover,.opt:hover,.bub:hover,.tile:hover,.icon-btn:hover{transform:translateY(-2px)}
  .card{max-width:640px;margin:0 auto}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--tw:min(300px,52vh)}

async function loadBuf(file) {

const fx = $("#fx"), fc = fx.getContext("2d"); let parts = [], raf = 0;
function confetti(n = 70) {
  const d = 1; fx.style.display = "block";
  fx.width = innerWidth * d; fx.height = innerHeight * d; fc.setTransform(d, 0, 0, d, 0, 0);
  const cols = ["#5B34D6", "#ffc83d", "#1fb57a", "#ff6b6b", "#3c9df0"];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, s: 6 + Math.random() * 6, c: cols[i % 5], r: Math.random() * 6, life: 90 });
  if (!raf) loop();
}
function loop() {
  fc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life-- > 0);
  parts.forEach((p) => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; fc.save(); fc.translate(p.x, p.y); fc.rotate(p.r); fc.fillStyle = p.c; fc.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fc.restore(); });

async function find(round) {
  const cols = ["#ff8a5b", "#3c9df0", "#ffb800", "#ff6b9a", "#22c58a", "#8b5cf6"];
  const sim = shuffle(simOf(LT.ch));
  const pool = shuffle(ALLCH.filter((x) => x !== LT.ch && !sim.includes(x)));
  const others = [...sim, ...pool].slice(0, 6);
  const cells = shuffle([LT.ch, LT.ch, LT.ch, ...others]);
  shell(MODE === "review" ? 1 + round : 2, `<div class="grid">${cells.map((c, i) => `<button class="bub" data-c="${c}" style="background:${cols[i % 6]}">${c}</button>`).join("")}</div>`, MODE === "review" ? 5 : STEPS);
  say(round ? "رائع! جولة أخرى. اضغط على كل فقاعة فيها الحرف." : `هيا نصطاد حرف ${LT.name}! اضغط على كل فقاعة فيها ${LT.ch}.`, round ? "find2" : "find1");
  let left = 3;
  const rounds = MODE === "review" ? 1 : 2;
  app.querySelectorAll(".bub").forEach((b) => b.onclick = async () => {
    if (b.dataset.c === LT.ch) {
      b.classList.add("ok"); sfx.pop(); setTimeout(sfx.ok, 90); R.find.hit++; b.onclick = null; left--;
      if (!left) {
        star(); confetti(40);
        app.querySelectorAll(".bub:not(.ok)").forEach((x) => x.classList.add("gone"));
        await wait(700);
        if (round + 1 < rounds) find(round + 1);
        else { await sayQ(`${praise()} عيونك قوية يا ${nm()}.`, "p.eyes"); MODE === "review" ? sounds(0) : trace(); }
      }
    } else {
      sfx.no(); R.find.miss++; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400);
      const o = LET.find((l) => l.ch === b.dataset.c);
      say(`هذا حرف ${o ? o.name : ""}. ابحث عن حرف ${LT.name}.`, "wrong." + (o ? o.id : ""));
    }
  });
}

/* ======================= 3) تتبّع الحرف ======================= */
async function trace() {
  shell(3, `
    <div class="trace-wrap" id="tw"><canvas id="cg"></canvas><canvas id="cd"></canvas></div>
    <div class="row"><button class="btn ghost" id="clr">↺ امسح</button><button class="btn" id="chk">تمّ ✔</button></div>`);
  say(`الآن ارسم حرف ${LT.name} بإصبعك فوق الحرف الرمادي. ابدأ من النقطة الخضراء.`, "trace");
  await document.fonts.load("700 230px Cairo").catch(() => {});
  const W = 300, d = Math.min(2, devicePixelRatio || 1);
  const cg = $("#cg"), cd = $("#cd");
  if (!cg || !cd) return;
  [cg, cd].forEach((c) => { c.width = W * d; c.height = W * d; });
  const g = cg.getContext("2d"), x = cd.getContext("2d");
  g.setTransform(d, 0, 0, d, 0, 0); x.setTransform(d, 0, 0, d, 0, 0);
  // قياس الحرف وتكبيره ليملأ اللوحة
  const mc = document.createElement("canvas").getContext("2d");
  mc.font = "700 200px Cairo"; const m = mc.measureText(LT.ch);
  const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const sc = Math.min(1.6, 215 / Math.max(gw, gh * 1.05, 1)), fs = 200 * sc;
  const ox = W / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 * sc, oy = W / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2 * sc;
  const drawL = (ctx, color, stroke = 0) => { ctx.font = `700 ${fs}px Cairo`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = color; ctx.fillText(LT.ch, ox, oy); if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = "round"; ctx.strokeText(LT.ch, ox, oy); } };
  drawL(g, "#e4dcff");
  const mk = (stroke) => { const c = document.createElement("canvas"); c.width = c.height = W; const t = c.getContext("2d"); drawL(t, "#000", stroke); return t.getImageData(0, 0, W, W).data; };
  const mask = mk(0), wide = mk(34);
  window.__zad.pts = []; for (let yy = 0; yy < W; yy += 8) for (let xx = 0; xx < W; xx += 8) if (mask[(yy * W + xx) * 4 + 3] > 100) window.__zad.pts.push([xx, yy]);
  let sx = 0, sy = 0;
  for (let y = 0; y < W && !sx; y++) for (let xx = W - 1; xx >= 0; xx--) if (mask[(y * W + xx) * 4 + 3] > 100) { sx = xx; sy = y; break; }
  g.fillStyle = "#1fb57a"; g.beginPath(); g.arc(sx - 4, sy + 14, 13, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = "700 11px Cairo"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("ابدأ", sx - 4, sy + 15);
  let drawing = false, lastP = null;
  x.lineWidth = 22; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#5B34D6";
  let rc = cd.getBoundingClientRect(); const pos = (e) => { const r = rc; return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; };
  cd.onpointerdown = (e) => { rc = cd.getBoundingClientRect(); drawing = true; lastP = pos(e); x.beginPath(); x.arc(lastP[0], lastP[1], 11, 0, 7); x.fillStyle = "#5B34D6"; x.fill(); cd.setPointerCapture(e.pointerId); sfx.tap(); };
  cd.onpointermove = (e) => { if (!drawing) return; const p = pos(e); x.beginPath(); x.moveTo(lastP[0], lastP[1]); x.lineTo(p[0], p[1]); x.stroke(); lastP = p; };
  cd.onpointerup = cd.onpointercancel = () => { drawing = false; };
  $("#clr").onclick = () => { x.clearRect(0, 0, W, W); sfx.pop(); };
  $("#chk").onclick = async () => {
    R.trace.tries++;
    const u = document.createElement("canvas"); u.width = u.height = W; u.getContext("2d").drawImage(cd, 0, 0, W, W);
    const ud = u.getContext("2d").getImageData(0, 0, W, W).data;
    let M = 0, C = 0, U = 0, Pm = 0;
    for (let i = 3; i < ud.length; i += 16) {
      const a = mask[i] > 100, b = ud[i] > 100, w = wide[i] > 100;
      if (a) { M++; if (b) C++; }
      if (b) { U++; if (w) Pm++; }
    }
    const cover = M ? C / M : 0, prec = U ? Pm / U : 0;
    if (cover > .5 && prec > .6) {
      sfx.win(); star(2); confetti(80);
      await sayQ(`${praise()} كتبت حرف ${LT.name} بنفسك يا ${nm()}.`, "p.trace");
      brk();
    } else {
      sfx.no();
      say(cover <= .5 ? "قرّبت! ارسم فوق الحرف كله، وانتبه للنقاط." : "حاول أن تبقى داخل الحرف الرمادي. هيا مرة أخرى!", cover <= .5 ? "t.more" : "t.stay");
      x.clearRect(0, 0, W, W);
    }
  };
}

  const tAcc = MODE === "review" ? null : r.trace.tries <= 1 ? 1 : r.trace.tries === 2 ? .8 : .6;
  const arr = [fAcc, sAcc, bAcc, tAcc].filter((v) => v !== null);

  $("#lv").onchange = (e) => { S.lvl = e.target.value; if (S.lvl === "mid") S.skill = Math.max(S.skill, 2); if (S.lvl === "adv") S.skill = 3; save(); };
  $("#lm").onchange = (e) => { S.lim = +e.target.value; save(); };
  $("#ag").onchange = (e) => { S.age = e.target.value; save(); }; $("#dl").onclick = dlReport; $("#acc").onclick = () => accScreen(); $("#subb").onclick = () => payScreen();
  $("#sh").onclick = () => { location.href = "https://wa.me/?text=" + encodeURIComponent(report); };
  if ($("#rm")) $("#rm").onclick = () => { if (!confirm(`حذف ملف ${S.name} نهائياً؟`)) return; delete DB.kids[DB.cur]; DB.cur = Object.keys(DB.kids).find((k) => DB.kids[k].name) || Object.keys(DB.kids)[0]; S = DB.kids[DB.cur]; save(); out(); };
}

window.__zad = { payScreen, setSub, achScreen, reportHTML, storyMenu, storyPlay, songPlay, shopScreen, wcBump, moreHub, GM, learnCards, LET, DB, get S() { return S; }, lvl, addXP, checkBadges, avatarScreen, badgesScreen, parent, gate, begin, hub, start, AUD, brk, race, posGame, daily, treasure, openBox, collection, learned };
if (!recoveryCheck()) start();
