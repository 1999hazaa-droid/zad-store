<style>

.sec{width:100%;font-weight:700;color:#6d6684;margin:2px 0 -4px}

/* ======================= بيانات الحروف الـ28 ======================= */

const GIRL = {};
const girlChunks = (t) => {
  t = String(t).replace(/[«»"“”:؛;…+=*\/()\[\]{}<>|_~^%$#@&`]/g, " ").replace(/[^\u0600-\u06ffA-Za-z0-9 ،؟.!?,'\-]/g, " ").replace(/\s+/g, " ").trim();

  const out = []; let cur = "";
  t.split(/(?<=[.!?؟،,])\s+/).forEach((sn) => {
    const ws = sn.split(" ");
    ws.forEach((w) => { if ((cur + " " + w).trim().length > 86) { if (cur) out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
    if (cur.length > 40) { out.push(cur); cur = ""; }

};
async function girlUrl(text) {
  if (GIRL[text]) return GIRL[text];
  for (let i = 0; i < 2; i++) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 9000);

  shell(MODE === "review" ? 1 + round : 2, `<div class="grid">${cells.map((c, i) => `<button class="bub" data-c="${c}" style="background:${cols[i % 6]}">${c}</button>`).join("")}</div>`, MODE === "review" ? 5 : STEPS);

        await wait(700);
        if (round + 1 < rounds) find(round + 1);

async function trace() {
  shell(3, `
    <div class="trace-wrap" id="tw"><canvas id="cg"></canvas><canvas id="cd"></canvas></div>
    <div class="row"><button class="btn ghost" id="clr">↺ امسح</button><button class="btn" id="chk">تمّ ✔</button></div>`);
  say(`الآن ارسم حرف ${LT.name} بإصبعك فوق الحرف الرمادي. ابدأ من النقطة الخضراء.`, "trace");
  await document.fonts.load("700 230px Cairo").catch(() => {});
  const W = 300, d = Math.min(2, devicePixelRatio || 1);
  const cg = $("#cg"), cd = $("#cd");
  if (!cg || !cd) return;

  const g = cg.getContext("2d"), x = cd.getContext("2d");

  const sc = Math.min(1.6, 215 / Math.max(gw, gh * 1.05, 1)), fs = 200 * sc;
  const ox = W / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 * sc, oy = W / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2 * sc;
  const drawL = (ctx, color, stroke = 0) => { ctx.font = `700 ${fs}px Cairo`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = color; ctx.fillText(LT.ch, ox, oy); if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = "round"; ctx.strokeText(LT.ch, ox, oy); } };
  drawL(g, "#e4dcff");
  const mk = (stroke) => { const c = document.createElement("canvas"); c.width = c.height = W; const t = c.getContext("2d"); drawL(t, "#000", stroke); return t.getImageData(0, 0, W, W).data; };
  const mask = mk(0), wide = mk(34);
  window.__zad.pts = []; for (let yy = 0; yy < W; yy += 8) for (let xx = 0; xx < W; xx += 8) if (mask[(yy * W + xx) * 4 + 3] > 100) window.__zad.pts.push([xx, yy]);
  let sx = 0, sy = 0;
  for (let y = 0; y < W && !sx; y++) for (let xx = W - 1; xx >= 0; xx--) if (mask[(y * W + xx) * 4 + 3] > 100) { sx = xx; sy = y; break; }
  g.fillStyle = "#1fb57a"; g.beginPath(); g.arc(sx - 4, sy + 14, 13, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = "700 11px Cairo"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("ابدأ", sx - 4, sy + 15);
  let drawing = false, lastP = null;
  x.lineWidth = 22; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#5B34D6";
  let rc = cd.getBoundingClientRect(); const pos = (e) => { const r = rc; return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height]; };
  cd.onpointerdown = (e) => { rc = cd.getBoundingClientRect(); drawing = true; lastP = pos(e); x.beginPath(); x.arc(lastP[0], lastP[1], 11, 0, 7); x.fillStyle = "#5B34D6"; x.fill(); cd.setPointerCapture(e.pointerId); sfx.tap(); };
  cd.onpointermove = (e) => { if (!drawing) return; const p = pos(e); x.beginPath(); x.moveTo(lastP[0], lastP[1]); x.lineTo(p[0], p[1]); x.stroke(); lastP = p; };
  cd.onpointerup = cd.onpointercancel = () => { drawing = false; };
  $("#clr").onclick = () => { x.clearRect(0, 0, W, W); sfx.pop(); };
  $("#chk").onclick = async () => {
    R.trace.tries++;
    const u = document.createElement("canvas"); u.width = u.height = W; u.getContext("2d").drawImage(cd, 0, 0, W, W);

    } else {

      say(cover <= .5 ? "قرّبت! ارسم فوق الحرف كله، وانتبه للنقاط." : "حاول أن تبقى داخل الحرف الرمادي. هيا مرة أخرى!", cover <= .5 ? "t.more" : "t.stay");

}

function score(r) {
  const fAcc = r.find.hit / Math.max(1, r.find.hit + r.find.miss);
  const sAcc = r.sound.ok / Math.max(1, r.sound.total);
  const bAcc = MODE === "review" ? null : 1 - Math.min(1, r.build.miss / 6);
  const tAcc = MODE === "review" ? null : r.trace.tries <= 1 ? 1 : r.trace.tries === 2 ? .8 : .6;
  const arr = [fAcc, sAcc, bAcc, tAcc].filter((v) => v !== null);
  return { fAcc, sAcc, bAcc, tAcc, all: Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 100), mins: Math.max(1, Math.round((Date.now() - r.start) / 60000)) };
}

    <p style="margin:0;font-weight:700">${subOk() ? `متبقّي ${left} يوم` : `جرّبت أول ${FREE_L} حروف مجاناً. الاشتراك يفتح الحروف الـ٢٨ وكل الألعاب والقصص والأناشيد وتقرير الأهل.`}</p></div>
    ${PLANS.map(([t, p, , d]) => `<button class="plan" data-d="${d}"><b>${t}</b><span>${p} ر.ع</span>${d === 365 ? "<em>الأوفر</em>" : ""}</button>`).join("")}
    <div class="card" style="width:100%"><b style="color:var(--p)">عندك كود تفعيل؟</b><input class="nm" id="cd" placeholder="ZD-XXXX-XXXX" style="direction:ltr;text-transform:uppercase;margin-top:6px"><button class="btn alt" id="cok" style="margin-top:10px">تفعيل</button><p id="cm" style="font-weight:700;color:var(--no);margin:8px 0 0;text-align:center">${msg}</p></div>
    <small style="text-align:center;font-weight:700;color:#6d6684">اختر الباقة وأرسل طلبك واتساب، وبعد الدفع نرسل لك الكود.</small></div>`;
  $("#home").onclick = () => { HOLD = false; hub(); };
  app.querySelectorAll(".plan").forEach((b) => b.onclick = () => { const pl = PLANS.find((x) => x[3] === +b.dataset.d); location.href = `https://wa.me/${WA}?text=` + encodeURIComponent(`أريد اشتراك «تعلّم والعب» – باقة ${pl[0]} (${pl[1]} ر.ع)${S.name ? "\nاسم الطفل: " + S.name : ""}`); });
  $("#cok").onclick = async () => {
    const c = $("#cd").value.trim(); if (!c) return; $("#cm").style.color = "var(--p)"; $("#cm").textContent = "...";
    try { const t = await rpc("learn_redeem", { p_code: c, p_device: DEV }); setSub(Date.parse(t)); sfx.win(); confetti(120); toast("🎉 تم التفعيل! أهلاً بك"); HOLD = false; hub(); }
    catch (e) { $("#cm").style.color = "var(--no)"; $("#cm").textContent = /used_code/.test(e.message) ? "هذا الكود مستخدم على جهاز آخر" : /invalid_code/.test(e.message) ? "الكود غير صحيح" : "تعذّر الاتصال، حاول لاحقاً"; }
  };
}

/* ======================= ولي الأمر ======================= */
function gate() {
  const a = 3 + (Math.random() * 5 | 0), b = 4 + (Math.random() * 5 | 0);
  app.innerHTML = `<div class="top"><button class="icon-btn" id="home">🏠</button></div>
  <div class="stage"><div class="card" style="text-align:center">
    <h2 style="margin:0 0 6px;color:var(--p)">لولي الأمر فقط</h2>
    <p style="margin:0 0 12px;font-weight:700">كم ناتج ${a} × ${b}؟</p>
    <input class="nm" id="ga" inputmode="numeric" maxlength="3">
    <button class="btn alt" id="gok" style="margin-top:14px">دخول</button></div></div>`;
  $("#home").onclick = start;
  $("#gok").onclick = () => { if (+$("#ga").value === a * b) parent(); else { $("#ga").value = ""; sfx.no(); $("#ga").classList.add("shake"); setTimeout(() => $("#ga").classList.remove("shake"), 400); } };
}
function parent(kid) {
  if (kid && DB.kids[kid]) useKid(kid);
  HOLD = true;
  const tag = (v) => (v >= .85 ? "متقن ✅" : v >= .6 ? "جيد 👍" : "يحتاج تكرار 🔁");
  const done = ALET.filter((l) => P(l.id).runs > 0);
  const best = ALET.filter((l) => P(l.id).best >= 85), weak = done.filter((l) => P(l.id).best < 85);
  const avg = (k) => { const v = done.map((l) => P(l.id).last && P(l.id).last[k]).filter((x) => typeof x === "number"); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const skills = [["التعرّف على الحرف بين حروف تشبهه", avg("fAcc")], ["كتابة الحرف بالتتبّع", avg("tAcc")], ["تمييز أصوات الحركات", avg("sAcc")], ["تركيب الكلمات", avg("bAcc")]].filter((x) => x[1] !== null);
  const mins = Object.values(S.log).reduce((a, d) => a + d.sec, 0) / 60 | 0, today = Math.round((S.log[dayKey()] || { sec: 0 }).sec / 60);
  const ws = weekStart(), days = [...Array(7)].map((_, i) => dayKey(new Date(ws.getTime() + i * 864e5)));
  const wmin = days.map((d) => Math.round(((S.log[d] || { sec: 0 }).sec) / 60)), wmax = Math.max(10, ...wmin), dn = ["س", "ح", "ن", "ث", "ر", "خ", "ج"];
  const nxt = doneCount() < 28 ? ALET[nextIdx()] : null;
  const sug = [];
  if (nxt) sug.push(`درس «${nxt.ch}» التالي (٥–٧ دقائق).`);
  if (weak.length) sug.push(`راجعوا الحروف: ${weak.slice(0, 4).map((l) => l.ch).join("، ")} بالتتبّع على الهواء ثم على الورق.`);
  if (S.words.length) sug.push(`اطلبوا منه قراءة كلمة مما تعلّم ثم البحث عن شيء في البيت يبدأ بحرفها.`);
  sug.push(S.lvl === "beg" ? "لعبة: اختر حرفاً وابحث معه عن ٣ أشياء في البيت تبدأ به." : S.lvl === "mid" ? "لعبة: «من يجد الحرف أولاً» في لافتة أو علبة منتج." : "تحدَّ طفلك: يكتب كلمة من ٣ حروف بحروف مفرّقة ثم يقرؤها.");
  const report = `تقرير «تعلّم والعب» الأسبوعي – زاد التعليمية\nالطفل: ${S.name}\nالمستوى: ${lvName()} (${lvl()}) · ⭐ ${S.stars} · 🏅 ${S.bd.length}\nالحروف المتقنة: ${doneCount()} من ٢٨\nكلمات يقرؤها: ${S.words.slice(-12).join("، ") || "—"}\nأيام النشاط هذا الأسبوع: ${wkNow().d.length} من ٧ · ${wmin.reduce((a, b) => a + b, 0)} دقيقة\n${skills.map((x) => `• ${x[0]}: ${tag(x[1])}`).join("\n")}\n💡 ${sug[0]}`;
  const ids = Object.keys(DB.kids).filter((k) => DB.kids[k].name);
  app.innerHTML = `<div class="top"><button class="icon-btn" id="home">🏠</button><span class="badge">لوحة ولي الأمر</span></div>
  <div class="stage" style="justify-content:flex-start"><div class="card parent">
    <div class="tabs">${ids.map((k) => `<button class="${k === DB.cur ? "on" : ""}" data-k="${k}">${avatar(DB.kids[k].av, 30)} ${DB.kids[k].name}</button>`).join("")}<button id="pk-add">➕ طفل</button></div>
    <h2>${S.name} <small>مستوى ${lvl()} · ${lvName()}</small></h2>
    <div class="kv"><span>الحروف المتقنة</span><span>${doneCount()} / ٢٨</span></div><div class="bar"><i style="width:${Math.round(doneCount() / 28 * 100)}%"></i></div>
    <div class="sec2">الحروف</div><div class="lgrid">${ALET.map((l) => { const b = P(l.id).best, r = P(l.id).runs; return `<span class="${b >= 85 ? "g" : r ? "y" : ""}" title="${b}%">${l.ch}</span>`; }).join("")}</div>
    <small class="lg"><b class="g"></b> متقن <b class="y"></b> يحتاج تكرار <b></b> لم يبدأ</small>
    <div class="sec2">كلمات يستطيع قراءتها (${S.words.length})</div>
    <div class="wds">${S.words.length ? S.words.map((w) => `<span>${w}</span>`).join("") : '<small>ستظهر هنا بعد ألعاب الكلمات.</small>'}</div>
    ${skills.map((x) => `<div class="kv"><span>${x[0]}</span><span>${tag(x[1])}</span></div><div class="bar"><i style="width:${Math.round(x[1] * 100)}%"></i></div>`).join("")}
    <div class="sec2">تقرير الأسبوع</div>
    <div class="kv"><span>أيام النشاط</span><span>${wkNow().d.length} من ٧</span></div>
    <div class="wb">${wmin.map((m, i) => `<div><i style="height:${Math.max(4, Math.round(m / wmax * 60))}px" class="${days[i] === dayKey() ? "t" : ""}"></i><small>${dn[i]}</small><small>${m}د</small></div>`).join("")}</div>
    <div class="kv"><span>اليوم</span><span>${today} دقيقة</span></div><div class="kv"><span>المجموع</span><span>${mins} دقيقة</span></div>
    <div class="note">💡 <b>أنشطة مقترحة</b><br>${sug.map((x) => "• " + x).join("<br>")}</div>
    <div class="sec2">الألعاب التي أكملها (${gamesList(S).length})</div>
    <div class="wds">${gamesList(S).length ? gamesList(S).map((g) => `<span>${g.e} ${g.t} · ${AD(g.n)}</span>`).join("") : "<small>لم يكمل ألعاباً بعد.</small>"}</div>
    <div class="sec2">الإعدادات</div>
    <label class="st">عمر الطفل (يتحكّم بالمحتوى المناسب)
      <select id="ag"><option value="4" ${S.age === "4" ? "selected" : ""}>٣–٤ سنوات — ألعاب بصرية وسهلة، بلا ألعاب قراءة</option><option value="6" ${S.age === "6" ? "selected" : ""}>٥–٦ سنوات — تحدّيات سهلة ومتوسطة</option><option value="8" ${S.age === "8" ? "selected" : ""}>الصف الأول إلى الرابع — كل المحتوى</option></select></label>
    <label class="st">المستوى التعليمي
      <select id="lv"><option value="beg" ${S.lvl === "beg" ? "selected" : ""}>مبتدئ — بالترتيب، الحرف يفتح بعد إتقان السابق</option><option value="mid" ${S.lvl === "mid" ? "selected" : ""}>متوسط — كل الحروف مفتوحة وتحديات متوسطة</option><option value="adv" ${S.lvl === "adv" ? "selected" : ""}>متقدّم — كل الحروف وتحديات أصعب</option></select></label>
    <label class="st">حدّ الاستخدام اليومي
      <select id="lm">${[[0, "بلا حدّ"], [10, "١٠ دقائق"], [15, "١٥ دقيقة"], [20, "٢٠ دقيقة"], [30, "٣٠ دقيقة"], [45, "٤٥ دقيقة"]].map(([v, t]) => `<option value="${v}" ${S.lim === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <div class="row" style="margin-top:14px"><button class="btn" id="sh">📲 أرسل التقرير واتساب</button><button class="btn alt" id="dl" style="min-width:0">⬇ تحميل التقرير</button></div>
    <button class="btn ${subOk() ? "ghost" : "alt"}" id="subb" style="min-width:0;margin-top:8px">${subOk() ? "✅ اشتراكك فعّال" : "⭐ الاشتراك والتفعيل"}</button>
    <button class="btn ghost" id="acc" style="min-width:0;margin-top:8px">☁️ الحساب والنسخ الاحتياطي ${SESS ? "✅" : ""}</button>
    ${ids.length > 1 ? '<button class="btn ghost" id="rm" style="min-width:0;margin-top:8px">حذف ملف هذا الطفل</button>' : ""}
  </div></div>`;
  const out = () => { HOLD = false; start(); };
  $("#home").onclick = out;
  app.querySelectorAll(".tabs [data-k]").forEach((b) => b.onclick = () => parent(b.dataset.k));
  $("#pk-add").onclick = () => { const id = "k" + Date.now(); DB.kids[id] = DEF(); useKid(id); out(); };
  $("#lv").onchange = (e) => { S.lvl = e.target.value; if (S.lvl === "mid") S.skill = Math.max(S.skill, 2); if (S.lvl === "adv") S.skill = 3; save(); };
  $("#lm").onchange = (e) => { S.lim = +e.target.value; save(); };
  $("#ag").onchange = (e) => { S.age = e.target.value; save(); }; $("#dl").onclick = dlReport; $("#acc").onclick = () => accScreen(); $("#subb").onclick = () => payScreen();
  $("#sh").onclick = () => { location.href = "https://wa.me/?text=" + encodeURIComponent(report); };
  if ($("#rm")) $("#rm").onclick = () => { if (!confirm(`حذف ملف ${S.name} نهائياً؟`)) return; delete DB.kids[DB.cur]; DB.cur = Object.keys(DB.kids).find((k) => DB.kids[k].name) || Object.keys(DB.kids)[0]; S = DB.kids[DB.cur]; save(); out(); };
}

window.__zad = { payScreen, setSub, achScreen, reportHTML, storyMenu, storyPlay, songPlay, shopScreen, wcBump, moreHub, GM, learnCards, ALET, DB, get S() { return S; }, lvl, addXP, checkBadges, avatarScreen, badgesScreen, parent, gate, begin, hub, start, AUD, brk, race, posGame, daily, treasure, openBox, collection, learned };
const hc = new URLSearchParams(location.hash.slice(1)).get("code");
if (hc && !recoveryCheck()) {
  history.replaceState(null, "", location.pathname);
  rpc("learn_redeem", { p_code: hc, p_device: DEV }).then((t) => { setSub(Date.parse(t)); start(); toast("🎉 تم تفعيل اشتراكك"); }).catch(() => start());
} else if (!recoveryCheck()) start();
})();
</script>
