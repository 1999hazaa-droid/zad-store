<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>رفع ملفات المنتجات – زاد</title>
<style>
body{font-family:Cairo,system-ui,sans-serif;background:#f6f7fb;margin:0;padding:18px;color:#1f2937}
.card{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h1{font-size:20px;margin:0 0 6px}p{margin:6px 0;line-height:1.8;font-size:15px;color:#4b5563}
button,label.btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#5b3df5;color:#fff;border:0;border-radius:12px;padding:13px;font:700 16px Cairo,system-ui;margin:12px 0;cursor:pointer}
button:disabled{opacity:.5}
#log{font-size:13px;line-height:1.9;max-height:55vh;overflow:auto;margin-top:8px}
.ok{color:#15803d}.bad{color:#b91c1c}.mut{color:#6b7280}
progress{width:100%;height:10px}
</style>
</head>
<body>
<div class="card">
<h1>رفع ملفات المنتجات (خاص)</h1>
<p id="state" class="mut">جاري التحقق من تسجيل الدخول...</p>
<p>اختر ملفات الـ ZIP التي أرسلها لك Claude (يمكنك تحديد عدة ملفات معاً). تُرفع الملفات إلى مخزن خاص ولا يراها أحد من المتجر، ثم يُربط كل ملف بمنتجه تلقائياً.</p>
<label class="btn" id="pick">اختيار الملفات<input id="f" type="file" accept=".zip,.pdf,application/zip,application/pdf" multiple hidden></label>
<progress id="bar" value="0" max="1" hidden></progress>
<div id="log"></div>
</div>
<script src="js/supabase-config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const log = (t, c = "") => { const d = document.createElement("div"); d.className = c; d.textContent = t; $("#log").prepend(d); };
const loadJSZip = () => new Promise((res, rej) => {
  if (window.JSZip) return res();
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
  s.onload = res; s.onerror = () => rej(new Error("تعذر تحميل مكتبة فك الضغط"));
  document.head.appendChild(s);
});
let sb = null;
(async () => {
  try {
    sb = await window.athrLoadSupabase();
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) {
      $("#state").innerHTML = 'لم تسجّل الدخول. <a href="index.html#admin">سجّل دخولك من لوحة الإدارة</a> ثم ارجع لهذه الصفحة.';
      $("#pick").style.display = "none"; return;
    }
    $("#state").textContent = "✅ تم تسجيل الدخول: " + (data.session.user.email || "");
    $("#state").className = "ok";
  } catch (e) { $("#state").textContent = "تعذر الاتصال: " + e.message; $("#state").className = "bad"; }
})();
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.pdf$/i;
async function pushOne(name, blob) {
  const id = name.slice(0, -4).toLowerCase();
  const path = id + ".pdf";
  const up = await sb.storage.from("paid-files").upload(path, blob, { upsert: true, contentType: "application/pdf", cacheControl: "0" });
  if (up.error) throw up.error;
  const r = await sb.from("products").update({ file_url: "private:" + path }).eq("id", id).select("id");
  if (r.error) throw r.error;
  if (!r.data || !r.data.length) throw new Error("المنتج غير موجود في قاعدة البيانات");
}
$("#f").addEventListener("change", async (ev) => {
  const files = [...ev.target.files]; ev.target.value = "";
  if (!files.length || !sb) return;
  const items = [];
  try {
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        await loadJSZip();
        const z = await JSZip.loadAsync(f);
        for (const [n, e] of Object.entries(z.files)) {
          if (e.dir) continue; const base = n.split("/").pop();
          items.push({ name: base, get: () => e.async("blob") });
        }
      } else items.push({ name: f.name, get: async () => f });
    }
  } catch (e) { log("خطأ في قراءة الملف: " + e.message, "bad"); return; }
  const bar = $("#bar"); bar.hidden = false; bar.max = items.length; bar.value = 0;
  let ok = 0, bad = 0;
  for (const it of items) {
    if (!UUID.test(it.name)) { log("تخطّي ملف غير معروف: " + it.name, "mut"); bar.value++; continue; }
    try {
      const raw = await it.get();
      await pushOne(it.name, new Blob([raw], { type: "application/pdf" }));
      ok++; log("✅ " + it.name.slice(0, 8) + "… رُفع وربط بالمنتج", "ok");
    } catch (e) { bad++; log("❌ " + it.name.slice(0, 8) + "…: " + (e.message || e), "bad"); }
    bar.value++;
  }
  log(`انتهى: ${ok} ناجح، ${bad} فشل`, bad ? "bad" : "ok");
});
</script>
</body>
</html>
