<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5427D5"><title>ألعابي التعليمية — زاد</title>
<script src="/zad-store/js/zad-theme.js"></script>
<link rel="stylesheet" href="../css/zad-tokens.css"><link rel="stylesheet" href="../css/zad-ui.css?v=3"></head><body>
<header class="ztop"><div class="zw"><a class="zlogo" href="../">زاد التعليمية</a><nav><a class="zn-main" href="../">🏠 الرئيسية</a><a href="../free/">الألعاب المجانية</a></nav></div></header>
<main class="zw"><section class="zsec" style="padding-bottom:0"><h1 style="margin:0;font-size:30px">🎒 ألعابي التعليمية</h1><p class="zsub">كل ما تحتاجه للّعب في مكان واحد</p></section>
<section class="zsec" style="padding-top:8px"><div class="zhead"><h2>ألعاب مقترحة</h2></div><div class="zgm" id="sug"></div></section>
<section class="zsec" style="padding-top:8px" id="recw" hidden><div class="zhead"><h2>لعبتها مؤخرًا</h2></div><div class="zgm" id="rec"></div></section>
<section class="zsec" style="padding-top:8px"><div class="zhead"><h2>حسب الصف</h2></div><div class="zgrid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
<a class="zcard zgr" href="../grades/#grade=g1"><b>1️⃣</b>الصف الأول</a><a class="zcard zgr" href="../grades/#grade=g2"><b>2️⃣</b>الصف الثاني</a><a class="zcard zgr" href="../grades/#grade=g3"><b>3️⃣</b>الصف الثالث</a><a class="zcard zgr" href="../grades/#grade=g4"><b>4️⃣</b>الصف الرابع</a></div></section>
<section class="zsec" style="padding-top:8px"><div class="zhead"><h2>حسب المادة</h2></div><div class="zgrid" id="subj" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"></div></section>
<section class="zsec" style="padding-top:8px;text-align:center"><a class="zbtn zb4" href="../games/#more">المزيد ‹</a> <a class="zbtn zb2" href="../">🏠 الصفحة الرئيسية</a></section></main>
<nav class="ztab"><a href="../"><b>🏠</b>الرئيسية</a><a href="../free/"><b>🎮</b>ألعاب</a><a class="on" href="#"><b>🎒</b>ألعابي</a><a href="../games/#more"><b>⋯</b>المزيد</a></nav>
<script>
(function(){var $=function(i){return document.getElementById(i)},esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function card(g){return '<a class="zcard zg" href="../games/#g='+g.id+'"><div class="zim">'+g.ic+'</div><div class="zbd"><b>'+esc(g.t)+'</b><small>'+esc(g.s)+'</small><span class="zbtn zb2 zgo">العب الآن</span></div></a>'}
var SI={"الرياضيات":"🔢","اللغة العربية":"✍️","العلوم والوقت":"🔬","الأشكال والتفكير":"🧠","مهارات الصغار":"🧩","القراءة والقرآن":"📖"};
fetch("../games/catalog.json").then(function(r){return r.json()}).then(function(G){
 var by=function(i){return G.find(function(g){return g.id===i})},played={},recent=[];
 try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("hg_log")===0){JSON.parse(localStorage.getItem(k)||"[]").forEach(function(e){played[e.i]=1;recent.push(e)})}}}catch(e){}
 recent.sort(function(a,b){return String(b.d).localeCompare(String(a.d))});var seen={},rl=[];recent.forEach(function(e){if(!seen[e.i]&&by(e.i)&&rl.length<4){seen[e.i]=1;rl.push(by(e.i))}});
 if(rl.length){$("recw").hidden=false;$("rec").innerHTML=rl.map(card).join("")}
 var sg=G.filter(function(g){return!played[g.id]&&g.lv===1}).slice(0,4);if(sg.length<4)sg=G.filter(function(g){return g.lv===1}).slice(0,4);
 $("sug").innerHTML=sg.map(card).join("");
 var subs=Array.from(new Set(G.map(function(g){return g.subj})));
 $("subj").innerHTML=subs.map(function(s){return '<a class="zcard zgr" href="../grades/#subj='+encodeURIComponent(s)+'"><b>'+(SI[s]||"📘")+'</b>'+esc(s)+'</a>'}).join("")
}).catch(function(){$("sug").innerHTML='<p>تعذّر التحميل.</p>'});
})();
</script></body></html>
