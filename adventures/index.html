<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5427D5"><title>المغامرات التعليمية</title>
<link rel="stylesheet" href="../css/zad-tokens.css"><link rel="stylesheet" href="../css/zad-ui.css?v=3"><style>
.zav{display:grid;grid-template-columns:auto 1fr;gap:var(--z-sp-3);padding:var(--z-sp-3);align-items:start}.zav .zi{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:46px;box-shadow:var(--z-sh-1)}
.zav h3{margin:0;font-size:var(--z-fs-lg)}.zav p{margin:4px 0;color:var(--z-ink2);font-size:15px}.zav .zg2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.zav .zbtn{min-height:48px;font-size:15px}
.zlistv{display:grid;gap:var(--z-sp-3);grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.zstep{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--z-ink2)}.zstep i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--z-tint);color:var(--z-pri);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
@media(max-width:420px){.zav{grid-template-columns:1fr}.zav .zi{width:64px;height:64px;font-size:34px}}
</style></head><body>
<header class="ztop"><div class="zw"><a class="zlogo" href="../">زاد التعليمية</a><nav><a class="zn-main" href="../">🏠 الرئيسية</a><a href="../free/">🎮 الألعاب</a><a href="../grades/">📚 الصفوف</a></nav></div></header>
<section class="zph" style="background:linear-gradient(135deg,#0F9488,#14B8A6)"><div class="zw"><div><div class="zbc"><a href="../">الرئيسية</a> › المغامرات</div><h1>🗺️ المغامرات التعليمية</h1><p>قصة قصيرة ومراحل، وزوزو يرافقك حتى النهاية</p><div class="zst"><span>٧ مغامرات</span><span>مجانية</span><span>🔊 بالصوت</span></div></div><img src="../games/chars/poses/boy-think-320.png" alt=""></div></section>
<main class="zw"><section class="zsec"><div class="zlistv" id="list"></div></section></main>
<nav class="ztab"><a href="../"><b>🏠</b>الرئيسية</a><a href="../free/"><b>🎮</b>ألعاب</a><a class="on" href="#"><b>🗺️</b>مغامرات</a><a href="../learn/"><b>⭐</b>تعلّم</a></nav>
<script>
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
fetch("../games/adventures.json").then(function(r){return r.json()}).then(function(A){
document.getElementById("list").innerHTML=A.map(function(a){return '<article class="zcard zav"><div class="zi" style="background:linear-gradient(135deg,'+a.c[0]+','+a.c[1]+')">'+a.em+'</div><div><h3>'+esc(a.n)+'</h3><p>'+esc(a.intro)+'</p><div class="zg2"><span class="zchip">🎯 '+esc(a.goal)+'</span><span class="zchip">'+a.st.length+' مراحل</span></div>'+a.st.map(function(s,i){return '<div class="zstep"><i>'+(i+1)+'</i>'+esc(s[0])+'</div>'}).join("")+'<a class="zbtn zb2" style="margin-top:10px;width:100%" href="../games/#a='+a.id+'">▶ ابدأ المغامرة</a></div></article>'}).join("")}).catch(function(){document.getElementById("list").innerHTML='<p>تعذّر التحميل.</p>'});
</script></body></html>
